<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
      html, body {
        height: 100%;
        margin: 0; /* remove default 8px body margin that caused 728px total */
        padding: 0;
      }
      .slide-container {
        width: 1280px;
        min-height: 720px;
        background-color: #D4D8DD;
        background-image: radial-gradient(#0F172A 1px, transparent 1px);
        background-size: 20px 20px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        position: relative;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }
      .main-box {
        border: 4px solid #0F172A;
        background-color: white;
        padding-top: 60px; /* keep title top padding as required */
        padding-left: 60px; /* slightly reduced horizontally */
        padding-right: 60px;
        padding-bottom: 40px; /* reduced bottom padding to save vertical space */
        width: 760px; /* slightly wider to keep balance after padding changes */
        text-align: center;
        box-shadow: 15px 15px 0px #F59E0B;
      }
      .title {
        font-size: 64px;
        color: #0F172A;
        text-transform: uppercase;
        letter-spacing: -0.05em;
        font-weight: 800;
        margin-bottom: 20px;
      }
      .subtitle {
        font-size: 28px;
        color: #334155;
        line-height: 1.6;
        font-weight: 400;
        margin: 0;
      }
      .accent-line {
        width: 100px;
        height: 10px;
        background-color: #F59E0B;
        margin-top: 24px; /* slightly reduced */
        margin-left: auto;
        margin-right: auto;
      }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="main-box">
            <h1 class="title">Relatório Executivo</h1>
            <p class="subtitle">Varredura e Auditoria de Carteiras Bitcoin<br>Arquitetura de Extração e Segurança em Lote</p>
            <div class="accent-line"></div>
        </div>
    </div>
</body>
</html>
