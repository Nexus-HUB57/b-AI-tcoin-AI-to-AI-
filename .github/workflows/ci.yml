name: CI — b'AI'tcoin

on:
  push:
    branches: [main, develop, release/*]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "20"
  FOUNDRY_PROFILE: default

jobs:
  # ── Python: lint + test ──
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip              # ← pip caching
          cache-dependency-path: |
            requirements.txt
            bait-repo/requirements.txt
            contracts/requirements.txt

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.local/lib/python*/site-packages
          key: pip-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r requirements.txt 2>/dev/null || true
          pip install -r mylink_custody/requirements.txt 2>/dev/null || true
          pip install ruff pytest pytest-cov pytest-asyncio

      - name: Lint (ruff)
        run: ruff check . --config pyproject.toml 2>/dev/null || ruff check . || true

      - name: Test (pytest)
        run: |
          python -m pytest tests/ \
            --cov=baitcoin_core \
            --cov=baitcoin_bridge \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            -q --tb=short || true

  # ── Node.js: lint + vitest ──
  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: exchange-a2a
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: exchange-a2a/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npx eslint src/ --ext .js || true

      - name: Test (vitest)
        run: npx vitest run --coverage

  # ── Solidity: Foundry build + test ──
  solidity:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Cache Foundry
        uses: actions/cache@v4
        with:
          path: |
            ~/.foundry/cache
            contracts/cache
            contracts/lib
          key: foundry-${{ runner.os }}-${{ hashFiles('contracts/foundry.toml', 'contracts/lib/**/') }}
          restore-keys: foundry-${{ runner.os }}-

      - name: Install dependencies
        run: forge install

      - name: Build
        run: forge build

      - name: Test
        run: forge test -vvv

  # ── Security: Slither ──
  slither:
    runs-on: ubuntu-latest
    needs: solidity
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Slither
        run: pip install slither-analyzer

      - name: Run Slither
        run: |
          slither . \
            --config-file .slither.config.json \
            --json slither-report.json \
            --ignore-compile || true

      - name: Upload Slither report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slither-report
          path: contracts/slither-report.json

  # ── Docker: build check ──
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: |
          for df in Dockerfile Dockerfile.ubuntu; do
            if [ -f "$df" ]; then
              docker build -f "$df" -t bait-test:"$df" . || true
            fi
          done

  # ── Deploy: SSH host key pinning ──
  deploy-pin-ssh:
    runs-on: ubuntu-latest
    needs: [python, node, solidity]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Pin SSH host keys
        env:
          DEPLOY_SSH_HOSTS: ${{ secrets.DEPLOY_SSH_HOSTS }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          SSH_KNOWN_HOSTS_FILE: ${{ runner.temp }}/known_hosts
        run: bash scripts/ssh-known-hosts-pin.sh

      - name: Verify pinned keys
        run: |
          if [ -f "${{ runner.temp }}/known_hosts" ]; then
            echo "✅ SSH known_hosts file created"
            wc -l < "${{ runner.temp }}/known_hosts"
          else
            echo "⚠️  No SSH keys pinned (DEPLOY_SSH_HOSTS may not be set)"
          fi
