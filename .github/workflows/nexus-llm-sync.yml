# ================================================================
# AI Store Nexus v2.0.0 — LLM Sync Workflow
# ================================================================
# Injects ANTHROPIC_API_KEY and OPENAI_API_KEY into VPS .env
# Triggers: push to main, manual dispatch, daily at 06:00 UTC
# Keys are NEVER exposed in logs or chat
# ================================================================

name: Nexus LLM Sync
on:
  push:
    branches: [main, fix/surgical-patches-v2-e2e-41-41]
    paths:
      - 'ops/mylink_activity_engine.py'
      - 'site/mylink/nexus/nucleus.json'
  schedule:
    - cron: '0 6 * * *'  # Daily at 06:00 UTC
  workflow_dispatch:
    inputs:
      force_resync:
        description: 'Force full resync of all secrets'
        required: false
        default: 'false'

permissions:
  contents: read

jobs:
  sync-llm-keys:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate API keys exist in secrets
        run: |
          if [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "::error::ANTHROPIC_API_KEY not configured in repository secrets"
            exit 1
          fi
          if [ -z "${{ secrets.OPENAI_API_KEY }}" ]; then
            echo "::warning::OPENAI_API_KEY not configured — Claude-only mode"
          fi
          echo "API key validation passed"

      - name: Deploy LLM config to VPS
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Add deploy host key
        run: mkdir -p ~/.ssh && echo "${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts

      - name: Gravar secrets no .env da VPS (via runner — nunca expostos em log)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            mkdir -p /home/baitcoin/.baitcoin
            touch /home/baitcoin/.baitcoin/.env
            chmod 600 /home/baitcoin/.baitcoin/.env
            grep -v '^ANTHROPIC_API_KEY=' /home/baitcoin/.baitcoin/.env > /tmp/.env.tmp || true
            grep -v '^OPENAI_API_KEY=' /tmp/.env.tmp > /tmp/.env.tmp2 || true
            mv /tmp/.env.tmp2 /home/baitcoin/.baitcoin/.env
            echo 'ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}' >> /home/baitcoin/.baitcoin/.env
            echo 'OPENAI_API_KEY=${OPENAI_API_KEY}' >> /home/baitcoin/.baitcoin/.env
            chmod 600 /home/baitcoin/.baitcoin/.env
            echo 'env atualizado, chaves gravadas (nao exibidas)'
          "
          echo "✅ Secrets sincronizados para o motor de atividade — nunca expostos neste log"

            # Update LLM keys (values injected via GitHub Secrets, never in this script)
            # The actual sed commands use environment variables passed from GitHub
            echo "LLM config synced at $(date)"

            # Restart daemon to pick up new keys
            pkill -HUP -f daemon_live.py 2>/dev/null || true
            echo "Daemon signaled for reload"

      - name: Trigger activity engine test cycle
        if: success()
        run: |
          ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            set -a; . /home/baitcoin/.baitcoin/.env 2>/dev/null; set +a
            python3 /home/baitcoin/app/mylink_activity_engine.py
            python3 -c \"import json; d=json.load(open('/home/baitcoin/.baitcoin/mylink_feed.json')); print('feed source apos run:', d.get('source'), '· total posts:', len(d.get('posts',[])))\"
          "

      - name: Health check
        if: success()
        run: |
          # Verify the feed is receiving LLM-generated content
          RESPONSE=$(curl -sf "https://www.mybait.org/api/api/v1/mylink/feed?limit=1" || echo "FAIL")
          if echo "$RESPONSE" | grep -q '"ok"'; then
            echo "Feed health check passed"
          else
            echo "::warning::Feed health check returned unexpected response"
          fi
