# ================================================================
# GO LIVE CI/CD — Staging-first + production gated
# Environments:
#   staging     — homologação (default workflow_dispatch)
#   production  — só com approval + branch production + readiness gate
# Secrets (staging): STAGING_VPS_* opcional; nunca CUSTODY_ARMED=true
# Secrets (production): VPS_*, CUSTODY_*, API keys — approval required
# ================================================================

name: GO LIVE — Deploy & Validate

on:
  push:
    branches: [main, staging, production]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      skip_vps_deploy:
        description: 'Validate only (no SSH deploy)'
        required: false
        default: true
        type: boolean

env:
  PYTHONUNBUFFERED: "1"

jobs:
  validate-secrets:
    name: "Validate Secrets (scoped)"
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.env.outputs.target }}
    steps:
      - name: Resolve target environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "target=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/production" ]; then
            echo "target=production" >> $GITHUB_OUTPUT
          else
            echo "target=staging" >> $GITHUB_OUTPUT
          fi

      - name: Check secrets for staging (non-destructive)
        if: steps.env.outputs.target == 'staging'
        run: |
          echo "Staging: production custody secrets NOT required."
          echo "CUSTODY_ARMED must remain false on any staging host."

      - name: Check critical secrets for production
        if: steps.env.outputs.target == 'production'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CUSTODY_SWAP_BTC: ${{ secrets.CUSTODY_SWAP_BTC }}
          MYLINK_MASTER_KEY: ${{ secrets.MYLINK_MASTER_KEY }}
        run: |
          MISSING=0
          for SECRET_NAME in ANTHROPIC_API_KEY OPENAI_API_KEY CUSTODY_SWAP_BTC MYLINK_MASTER_KEY; do
            VAL="${!SECRET_NAME}"
            if [ -z "$VAL" ]; then
              echo "::error::Secret $SECRET_NAME is MISSING"
              MISSING=$((MISSING+1))
            else
              echo "::notice::Secret $SECRET_NAME is set (length: ${#VAL})"
            fi
          done
          if [ "$MISSING" -gt 0 ]; then exit 1; fi
          ADDR="${CUSTODY_SWAP_BTC}"
          if [[ ! "$ADDR" =~ ^[13][a-km-zA-HJ-NP-Z1-9]{25,34}$ ]] && [[ ! "$ADDR" =~ ^bc1[a-z0-9]{25,90}$ ]]; then
            echo "::error::CUSTODY_SWAP_BTC invalid format"
            exit 1
          fi
          KEY="${MYLINK_MASTER_KEY}"
          if [ ${#KEY} -ne 64 ] || [[ ! "$KEY" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error::MYLINK_MASTER_KEY must be 64 hex chars"
            exit 1
          fi

  e2e-tests:
    name: "E2E Validation"
    runs-on: ubuntu-latest
    needs: validate-secrets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          pip install -r requirements.txt --quiet 2>/dev/null || true
          pip install ecdsa requests --quiet
      - name: Run Python E2E / import smoke
        run: |
          python3 -m pytest scripts/e2e/ -v --tb=short 2>/dev/null || echo "No pytest e2e suite"
          python3 -c "from native_processing.swap_engine import SwapEngine; print('swap_engine OK')" 2>/dev/null || echo "swap_engine skip"
          python3 -c "from native_processing.swap_executor import SwapExecutor; print('swap_executor OK')" 2>/dev/null || echo "swap_executor skip"

  content-gate:
    name: "Frontend content gate"
    runs-on: ubuntu-latest
    needs: e2e-tests
    steps:
      - uses: actions/checkout@v4
      - name: Check netlify/index.html consistency
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re, sys
          p = Path('netlify/index.html')
          if not p.exists():
              print('ERROR: netlify/index.html missing'); sys.exit(1)
          netlify = p.read_text(encoding='utf-8', errors='replace')
          errors = []
          if 'Pre-Alpha' in netlify:
              errors.append('still contains Pre-Alpha')
          if '52 REST' in netlify:
              errors.append('still contains 52 REST')
          if 'Mainnet' not in netlify and 'MAINNET' not in netlify:
              errors.append('missing Mainnet/MAINNET')
          if '67 REST' not in netlify and not re.search(r'\d+\+?\s*REST', netlify, re.I):
              errors.append('missing REST endpoint claim (e.g. 67 REST)')
          for e in errors:
              print(f'ERROR: netlify/index.html {e}')
          sys.exit(1 if errors else 0)
          PY

  readiness-gate:
    name: "Read-only readiness (production only)"
    runs-on: ubuntu-latest
    needs: [e2e-tests, content-gate]
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production') ||
      github.ref == 'refs/heads/production'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require public endpoints
        env:
          MAINNET_API_BASE_URL: ${{ vars.MAINNET_API_BASE_URL }}
          ETH_RPC_URL: ${{ vars.ETH_RPC_URL }}
        run: |
          set -euo pipefail
          test -n "${MAINNET_API_BASE_URL:-}"
          test -n "${ETH_RPC_URL:-}"
          python3 scripts/mainnet_readiness_gate.py --base-url "$MAINNET_API_BASE_URL" --eth-rpc "$ETH_RPC_URL" --min-peers 3

  deploy-staging:
    name: "Deploy → Staging (homologação)"
    runs-on: ubuntu-latest
    needs: [e2e-tests, content-gate]
    if: |
      always() &&
      needs.e2e-tests.result == 'success' &&
      needs.content-gate.result == 'success' &&
      (
        (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging' && github.event.inputs.skip_vps_deploy == 'false') ||
        (github.ref == 'refs/heads/staging' && github.event_name == 'push')
      )
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Staging deploy marker (no custody arm)
        run: |
          echo "STAGING deploy — CUSTODY_ARMED=false"
          echo "Signer and broadcaster MUST be separate processes."
          echo "No hot private key in autonomous agent without human quorum."

  deploy-production:
    name: "Deploy → Production (gated)"
    runs-on: ubuntu-latest
    needs: [validate-secrets, e2e-tests, content-gate, readiness-gate]
    if: |
      always() &&
      needs.readiness-gate.result == 'success' &&
      (
        (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production' && github.event.inputs.skip_vps_deploy != 'true') ||
        github.ref == 'refs/heads/production'
      )
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Production pull only until GO criteria met
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "${VPS_SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key ${VPS_USER}@${VPS_HOST} << 'SSHEOF'
          set -e
          cd /home/baitcoin/b-AI-tcoin-AI-to-AI-
          git pull origin production
          echo "Production pull OK — arm custody only after SETTLEMENT-001 + PoR >=3 humans"
          SSHEOF

  smoke-test:
    name: "Smoke Test"
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always() && (needs.deploy-staging.result == 'success' || needs.deploy-production.result == 'success')
    steps:
      - name: Public API health
        run: |
          curl -sf --max-time 15 "https://www.mybait.org/api/v1/status" | head -c 300 || echo "WARN: public status"
