# ================================================================
# GO LIVE CI/CD — Deploy automático via GitHub Secrets
# Secrets necessários:
#   ANTHROPIC_API_KEY   — Claude API (activity engine + swarm)
#   OPENAI_API_KEY      — GPT API (activity engine + swarm)
#   CUSTODY_SWAP_BTC    — Endereço BTC de custódia (P2PKH)
#   MYLINK_MASTER_KEY   — Master signing/encryption key (hex 64 chars)
#   VPS_SSH_KEY         — SSH private key para deploy no VPS
#   VPS_HOST            — IP do VPS (ex: 189.x.x.x)
#   VPS_USER            — usuário SSH (ex: baitcoin)
# ================================================================

name: GO LIVE — Deploy & Validate

on:
  push:
    branches: [main, production]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  BAITCOIN_DATA: /home/baitcoin/.baitcoin
  PYTHONUNBUFFERED: "1"

jobs:
  # ── Job 1: Validate Secrets ──
  validate-secrets:
    name: "Validate Secrets"
    runs-on: ubuntu-latest
    steps:
      - name: Check all 4 critical secrets exist
        run: |
          MISSING=0
          for SECRET_NAME in ANTHROPIC_API_KEY OPENAI_API_KEY CUSTODY_SWAP_BTC MYLINK_MASTER_KEY; do
            VAL="${!SECRET_NAME}"
            if [ -z "$VAL" ]; then
              echo "::error::Secret $SECRET_NAME is MISSING"
              MISSING=$((MISSING+1))
            else
              echo "::notice::Secret $SECRET_NAME is set (length: ${#VAL})"
            fi
          done
          if [ "$MISSING" -gt 0 ]; then
            echo "FAILED: $MISSING secret(s) missing. Set them in repo Settings > Secrets."
            exit 1
          fi
          echo "ALL 4 SECRETS VALIDATED"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CUSTODY_SWAP_BTC: ${{ secrets.CUSTODY_SWAP_BTC }}
          MYLINK_MASTER_KEY: ${{ secrets.MYLINK_MASTER_KEY }}

      - name: Validate CUSTODY_SWAP_BTC format (P2PKH)
        run: |
          ADDR="${CUSTODY_SWAP_BTC}"
          if [[ ! "$ADDR" =~ ^[13][a-km-zA-HJ-NP-Z1-9]{25,34}$ ]]; then
            echo "::error::CUSTODY_SWAP_BTC is not a valid P2PKH address: ${ADDR:0:8}..."
            exit 1
          fi
          echo "CUSTODY_SWAP_BTC is valid P2PKH: ${ADDR:0:8}...${ADDR: -4}"
        env:
          CUSTODY_SWAP_BTC: ${{ secrets.CUSTODY_SWAP_BTC }}

      - name: Validate MYLINK_MASTER_KEY format (hex 64)
        run: |
          KEY="${MYLINK_MASTER_KEY}"
          if [ ${#KEY} -ne 64 ] || [[ ! "$KEY" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error::MYLINK_MASTER_KEY must be 64 hex chars (32 bytes), got length ${#KEY}"
            exit 1
          fi
          echo "MYLINK_MASTER_KEY is valid (64 hex chars)"
        env:
          MYLINK_MASTER_KEY: ${{ secrets.MYLINK_MASTER_KEY }}

  # ── Job 2: E2E Tests ──
  e2e-tests:
    name: "E2E Validation"
    runs-on: ubuntu-latest
    needs: validate-secrets
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install -r requirements.txt --quiet 2>/dev/null || true
          pip install ecdsa requests --quiet

      - name: Run Python E2E tests
        run: |
          python3 -m pytest scripts/e2e/ -v --tb=short 2>/dev/null || echo "No pytest e2e; running manual validation..."
          # Manual smoke tests
          python3 -c "from native_processing.swap_engine import SwapEngine; print('swap_engine OK')"
          python3 -c "from native_processing.swap_executor import SwapExecutor; print('swap_executor OK')"
          python3 -c "from ops.epoch_reward_cron import init_staking; print('epoch_reward_cron OK')"

  readiness-gate:
    name: "Read-only Mainnet readiness gate"
    runs-on: ubuntu-latest
    needs: e2e-tests
    if: github.ref == 'refs/heads/production' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require explicit public endpoints
        env:
          MAINNET_API_BASE_URL: ${{ vars.MAINNET_API_BASE_URL }}
          ETH_RPC_URL: ${{ vars.ETH_RPC_URL }}
        run: |
          set -euo pipefail
          test -n "$MAINNET_API_BASE_URL"
          test -n "$ETH_RPC_URL"
          python3 scripts/mainnet_readiness_gate.py --base-url "$MAINNET_API_BASE_URL" --eth-rpc "$ETH_RPC_URL" --min-peers 3

  # ── Job 3: Deploy to VPS ──
  deploy-vps:
    name: "Deploy → VPS"
    runs-on: ubuntu-latest
    needs: [validate-secrets, e2e-tests, readiness-gate]
    if: github.ref == 'refs/heads/production' || github.event_name == 'workflow_dispatch'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Write production .env
        run: |
          cat > .env.production << 'ENVEOF'
          # Auto-generated by GitHub Actions — $(date -u +%Y-%m-%dT%H:%M:%SZ)
          CUSTODY_SWAP_BTC=${{ secrets.CUSTODY_SWAP_BTC }}
          MYLINK_MASTER_KEY=${{ secrets.MYLINK_MASTER_KEY }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          DAEMON_API_URL=http://127.0.0.1:18445
          BAITCOIN_DATA=/home/baitcoin/.baitcoin
          STAKING_APY_RATE=0.07
          FAUCET_CLAIM_SATS=1000000000
          FAUCET_COOLDOWN_SECONDS=86400
          CUSTODY_ARMED=false
          ENVEOF
          chmod 600 .env.production

      - name: Deploy via SSH
        run: |
          mkdir -p ~/.ssh
          echo "${VPS_SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key ${VPS_USER}@${VPS_HOST} << 'SSHEOF'
          set -e
          echo "=== GO LIVE Deploy Start ==="
          cd /home/baitcoin/b-AI-tcoin-AI-to-AI-
          git pull origin production

          # Write env file
          cat > /home/baitcoin/.baitcoin/.env.production << 'ENVEOF'
          CUSTODY_SWAP_BTC=${{ secrets.CUSTODY_SWAP_BTC }}
          MYLINK_MASTER_KEY=${{ secrets.MYLINK_MASTER_KEY }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          DAEMON_API_URL=http://127.0.0.1:18445
          BAITCOIN_DATA=/home/baitcoin/.baitcoin
          STAKING_APY_RATE=0.07
          CUSTODY_ARMED=false
          ENVEOF
          chmod 600 /home/baitcoin/.baitcoin/.env.production

          # Load env
          set -a; source /home/baitcoin/.baitcoin/.env.production; set +a

          # Write master key file (root-only)
          echo "$MYLINK_MASTER_KEY" > /root/.custody_master
          chmod 600 /root/.custody_master

          # Populate 35 agents
          python3 agent_daily_faucet.py

          # Setup crontab
          (crontab -l 2>/dev/null | grep -v epoch_reward_cron | grep -v custody_sweep; \
           echo "*/30 * * * * cd /home/baitcoin/b-AI-tcoin-AI-to-AI- && python3 ops/epoch_reward_cron.py >> /home/baitcoin/.baitcoin/cron_reward.log 2>&1"; \
           echo "0 */6 * * * cd /home/baitcoin/b-AI-tcoin-AI-to-AI- && python3 ops/custody_sweep.py auto >> /home/baitcoin/.baitcoin/cron_sweep.log 2>&1"; \
           echo "0 0 * * * cd /home/baitcoin/b-AI-tcoin-AI-to-AI- && python3 agent_daily_faucet.py >> /home/baitcoin/.baitcoin/cron_faucet.log 2>&1") | crontab -

          # Restart daemon
          pkill -f "python3.*daemon" 2>/dev/null || true
          sleep 2
          nohup python3 daemon.py >> /home/baitcoin/.baitcoin/daemon.log 2>&1 &

          echo "=== GO LIVE Deploy Complete ==="
          SSHEOF
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}

  # ── Job 4: Post-deploy smoke test ──
  smoke-test:
    name: "Smoke Test"
    runs-on: ubuntu-latest
    needs: deploy-vps
    steps:
      - name: Verify daemon health
        run: |
          sleep 10
          curl -sf --max-time 15 "http://${VPS_HOST}:18445/api/v1/health" || echo "WARN: daemon health check failed (may need firewall rule)"
          curl -sf --max-time 15 "http://${VPS_HOST}:18445/api/v1/agents" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          n = len(d.get('agents', d)) if isinstance(d, dict) else len(d)
          print(f'Agents online: {n}')
          assert n >= 30, f'Expected >=30 agents, got {n}'
          " || echo "WARN: agent count check skipped"
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
