# ================================================================
# GO LIVE CI/CD — Staging-first + production gated
# ================================================================

name: GO LIVE — Deploy & Validate

on:
  push:
    branches: [main, staging, production]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      skip_vps_deploy:
        description: 'Validate only (no SSH deploy)'
        required: false
        default: true
        type: boolean

env:
  PYTHONUNBUFFERED: "1"

jobs:
  validate-secrets:
    name: "Validate Secrets (scoped)"
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.env.outputs.target }}
    steps:
      - name: Resolve target environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "target=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/production" ]; then
            echo "target=production" >> $GITHUB_OUTPUT
          else
            echo "target=staging" >> $GITHUB_OUTPUT
          fi
      - name: Check secrets for staging (non-destructive)
        if: steps.env.outputs.target == 'staging'
        run: |
          echo "Staging: production custody secrets NOT required."
          echo "CUSTODY_ARMED must remain false on any staging host."
      - name: Check critical secrets for production
        if: steps.env.outputs.target == 'production'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CUSTODY_SWAP_BTC: ${{ secrets.CUSTODY_SWAP_BTC }}
          MYLINK_MASTER_KEY: ${{ secrets.MYLINK_MASTER_KEY }}
        run: |
          MISSING=0
          for SECRET_NAME in ANTHROPIC_API_KEY OPENAI_API_KEY CUSTODY_SWAP_BTC MYLINK_MASTER_KEY; do
            VAL="${!SECRET_NAME}"
            if [ -z "$VAL" ]; then echo "::error::Secret $SECRET_NAME is MISSING"; MISSING=$((MISSING+1)); fi
          done
          if [ "$MISSING" -gt 0 ]; then exit 1; fi

  # Staging tem credenciais e destino próprios. Nunca reutiliza o VPS de produção.
  validate-staging-secrets:
    name: "Validate Staging Secrets"
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'staging'
    environment: staging
    steps:
      - name: Check isolated staging secrets
        env:
          STAGING_VPS_SSH_KEY: ${{ secrets.STAGING_VPS_SSH_KEY }}
          STAGING_VPS_HOST: ${{ secrets.STAGING_VPS_HOST }}
          STAGING_VPS_PORT: ${{ secrets.STAGING_VPS_PORT }}
          STAGING_VPS_USER: ${{ secrets.STAGING_VPS_USER }}
          STAGING_SERVICE_NAME: ${{ secrets.STAGING_SERVICE_NAME }}
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          STAGING_WWW_ROOT: ${{ secrets.STAGING_WWW_ROOT }}
          STAGING_APP_ROOT: ${{ secrets.STAGING_APP_ROOT }}
        run: |
          set -euo pipefail
          missing=0
          for name in STAGING_VPS_SSH_KEY STAGING_VPS_HOST STAGING_VPS_PORT STAGING_VPS_USER STAGING_SERVICE_NAME STAGING_BASE_URL STAGING_WWW_ROOT STAGING_APP_ROOT; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is missing from the staging environment"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          [[ "$STAGING_VPS_PORT" =~ ^[0-9]{1,5}$ ]] || { echo "::error::STAGING_VPS_PORT must be numeric"; exit 1; }
          [[ "$STAGING_SERVICE_NAME" =~ ^[A-Za-z0-9_.@-]+$ ]] || { echo "::error::invalid staging service name"; exit 1; }
          [[ "$STAGING_WWW_ROOT" = /* ]] || { echo "::error::STAGING_WWW_ROOT must be absolute"; exit 1; }
          [[ "$STAGING_APP_ROOT" = /* ]] || { echo "::error::STAGING_APP_ROOT must be absolute"; exit 1; }
          [[ "$STAGING_BASE_URL" = https://* ]] || { echo "::error::STAGING_BASE_URL must use HTTPS"; exit 1; }
          echo "Isolated staging target validated"

  # ── Job 2: E2E Tests ──
  e2e-tests:
    name: "E2E Validation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          pip install -r requirements.txt --quiet 2>/dev/null || true
          pip install ecdsa requests --quiet
      - name: Run Python E2E / import smoke
        run: |
          python3 -m pytest scripts/e2e/ -v --tb=short 2>/dev/null || echo "No pytest e2e suite"
          python3 -c "from native_processing.swap_engine import SwapEngine; print('swap_engine OK')" 2>/dev/null || echo "swap_engine skip"

  content-gate:
    name: "Frontend content gate"
    runs-on: ubuntu-latest
    needs: [validate-secrets, e2e-tests]
    if: github.ref == 'refs/heads/production' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Check netlify/index.html consistency
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re, sys
          p = Path('netlify/index.html')
          if not p.exists():
              print('ERROR: netlify/index.html missing'); sys.exit(1)
          netlify = p.read_text(encoding='utf-8', errors='replace')
          errors = []
          if 'Pre-Alpha' in netlify:
              errors.append('still contains Pre-Alpha')
          if '52 REST' in netlify:
              errors.append('still contains 52 REST')
          if 'Mainnet' not in netlify and 'MAINNET' not in netlify:
              errors.append('missing Mainnet/MAINNET')
          # Accept "67 REST", "56+ endpoints REST", etc.
          if not re.search(r'\d+\+?\s*(endpoints\s+)?REST|REST\s+endpoints', netlify, re.I):
              errors.append('missing REST endpoint claim')
          for e in errors:
              print(f'ERROR: netlify/index.html {e}')
          if errors:
              sys.exit(1)
          print('Content consistency OK')
          PY

  readiness-gate:
    name: "Read-only readiness (production only)"
    runs-on: ubuntu-latest
    needs: [e2e-tests, content-gate]
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production') ||
      github.ref == 'refs/heads/production'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require public endpoints
        env:
          MAINNET_API_BASE_URL: ${{ vars.MAINNET_API_BASE_URL }}
          ETH_RPC_URL: ${{ vars.ETH_RPC_URL }}
        run: |
          set -euo pipefail
          test -n "${MAINNET_API_BASE_URL:-}"
          test -n "${ETH_RPC_URL:-}"
          python3 scripts/mainnet_readiness_gate.py --base-url "$MAINNET_API_BASE_URL" --eth-rpc "$ETH_RPC_URL" --min-peers 3

  deploy-staging:
    name: "Deploy → Staging (homologação)"
    runs-on: ubuntu-latest
    needs: [e2e-tests, content-gate]
    if: |
      always() && needs.e2e-tests.result == 'success' && needs.content-gate.result == 'success' &&
      ((github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging' && github.event.inputs.skip_vps_deploy == 'false') ||
       (github.ref == 'refs/heads/staging' && github.event_name == 'push'))
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Staging deploy marker (no custody arm)
        run: |
          echo "STAGING — CUSTODY_ARMED=false; signer ≠ broadcaster"

  deploy-production:
    name: "Deploy → Production (gated)"
    runs-on: ubuntu-latest
    needs: [validate-secrets, e2e-tests, content-gate, readiness-gate]
    if: |
      always() && needs.readiness-gate.result == 'success' &&
      ((github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production' && github.event.inputs.skip_vps_deploy != 'true') ||
       github.ref == 'refs/heads/production')
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Production pull only until GO criteria met
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "${VPS_SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key ${VPS_USER}@${VPS_HOST} \
            'cd /home/baitcoin/b-AI-tcoin-AI-to-AI- && git pull origin production && echo CUSTODY_ARMED stays false until SETTLEMENT-001'

  # Staging deploya somente no alvo separado e nunca usa os segredos de produção.
  deploy-staging:
    name: "Deploy → Staging"
    runs-on: ubuntu-latest
    needs: [validate-staging-secrets, e2e-tests]
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'staging'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Prepare isolated SSH
        env:
          STAGING_VPS_SSH_KEY: ${{ secrets.STAGING_VPS_SSH_KEY }}
          STAGING_VPS_HOST: ${{ secrets.STAGING_VPS_HOST }}
          STAGING_VPS_PORT: ${{ secrets.STAGING_VPS_PORT }}
          STAGING_VPS_USER: ${{ secrets.STAGING_VPS_USER }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$STAGING_VPS_SSH_KEY" > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key
          ssh-keyscan -p "$STAGING_VPS_PORT" -H "$STAGING_VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Send additive staging package
        env:
          STAGING_VPS_HOST: ${{ secrets.STAGING_VPS_HOST }}
          STAGING_VPS_PORT: ${{ secrets.STAGING_VPS_PORT }}
          STAGING_VPS_USER: ${{ secrets.STAGING_VPS_USER }}
        run: |
          set -euo pipefail
          tar czf /tmp/baitcoin-staging.tgz site ops
          scp -i ~/.ssh/staging_key -P "$STAGING_VPS_PORT" /tmp/baitcoin-staging.tgz \
            "$STAGING_VPS_USER@$STAGING_VPS_HOST:/tmp/baitcoin-staging.tgz"

      - name: Apply staging package with isolated paths
        env:
          STAGING_VPS_HOST: ${{ secrets.STAGING_VPS_HOST }}
          STAGING_VPS_PORT: ${{ secrets.STAGING_VPS_PORT }}
          STAGING_VPS_USER: ${{ secrets.STAGING_VPS_USER }}
          STAGING_SERVICE_NAME: ${{ secrets.STAGING_SERVICE_NAME }}
          STAGING_WWW_ROOT: ${{ secrets.STAGING_WWW_ROOT }}
          STAGING_APP_ROOT: ${{ secrets.STAGING_APP_ROOT }}
        run: |
          set -euo pipefail
          printf 'MYLINK_SERVICE_NAME=%q\nMYLINK_WWW_ROOT=%q\nMYLINK_APP_ROOT=%q\n' \
            "$STAGING_SERVICE_NAME" "$STAGING_WWW_ROOT" "$STAGING_APP_ROOT" > /tmp/staging-env
          scp -i ~/.ssh/staging_key -P "$STAGING_VPS_PORT" /tmp/staging-env \
            "$STAGING_VPS_USER@$STAGING_VPS_HOST:/tmp/staging-env"
          ssh -i ~/.ssh/staging_key -p "$STAGING_VPS_PORT" \
            "$STAGING_VPS_USER@$STAGING_VPS_HOST" \
            'set -euo pipefail; mkdir -p /tmp/staging-release; tar xzf /tmp/baitcoin-staging.tgz -C /tmp/staging-release; rm -rf /tmp/site /tmp/ops; cp -a /tmp/staging-release/site /tmp/site; cp -a /tmp/staging-release/ops /tmp/ops; set -a; source /tmp/staging-env; set +a; bash /tmp/ops/apply_mylink.sh'

  smoke-test-staging:
    name: "Staging Smoke Test"
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'staging'
    environment: staging
    steps:
      - name: Verify isolated staging health
        env:
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 "$STAGING_BASE_URL/mylink" >/dev/null
          echo "Staging smoke test passed"

  # ── Job 4: Post-deploy smoke test ──
  smoke-test:
    name: "Smoke Test"
    runs-on: ubuntu-latest
    needs: deploy-vps
    if: github.ref == 'refs/heads/production' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')
    steps:
      - run: curl -sf --max-time 15 "https://www.mybait.org/api/v1/status" | head -c 300 || echo "WARN"
