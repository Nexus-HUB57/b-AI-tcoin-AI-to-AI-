name: Deploy MyVideo (FTP)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to confirm'
        required: true
        default: 'DEPLOY'

jobs:
  deploy:
    name: Deploy MyVideo via FTP
    runs-on: ubuntu-latest
    timeout-minutes: 8
    if: ${{ github.event.inputs.confirm == 'DEPLOY' }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse HostGator credentials
        env:
          HG_CREDS: ${{ secrets.CREDENCIAIS_HOSTGATOR }}
        run: |
          eval $(python3 -c "
          import os, json
          c = json.loads(os.environ['HG_CREDS'])
          print(f\"HOST={c.get('host','')}\")
          print(f\"USER={c.get('user','')}\")
          print(f\"PASS={c.get('password','')}\")
          print(f\"PORT={c.get('port', 21)}\")
          ")
          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$PASS" ]; then
            echo "::error::Missing credentials"; exit 1
          fi
          echo "HOST=$HOST" >> $GITHUB_ENV
          echo "USER=$USER" >> $GITHUB_ENV
          echo "PASS=$PASS" >> $GITHUB_ENV
          echo "PORT=$PORT" >> $GITHUB_ENV
          echo "Credentials parsed OK"

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Deploy frontend files
        run: |
          echo "=== Uploading HTML files ==="
          
          # Upload all frontend HTML files + CGI
          lftp -u "$USER","$PASS" -p "$PORT" "$HOST" <<EOF
          set ftp:ssl-force true
          set ssl:verify-certificate no
          set net:timeout 30
          
          # Main pages
          put netlify/index.html -o public_html/index.html
          put netlify/blockchain.html -o public_html/blockchain.html
          put netlify/bainkr.html -o public_html/bainkr.html
          put netlify/faucet.html -o public_html/faucet.html
          put netlify/fundo.html -o public_html/fundo.html
          put netlify/swap.html -o public_html/swap.html
          put netlify/sdk.html -o public_html/sdk.html
          put netlify/obscura.html -o public_html/obscura.html
          put netlify/myvideo.html -o public_html/myvideo.html
          put netlify/favicon.svg -o public_html/favicon.svg
          put netlify/.htaccess -o public_html/.htaccess
          
          # CGI gateway (MUST be executable)
          put netlify/api.cgi -o public_html/api.cgi
          chmod 755 public_html/api.cgi
          
          # MyLink sub-pages
          mkdir public_html/mylink
          mkdir public_html/mylink/fundo
          mkdir public_html/mylink/fundo/swap
          mkdir public_html/mylink/myvideo
          
          put netlify/fundo.html -o public_html/mylink/fundo/index.html
          put netlify/swap.html -o public_html/mylink/fundo/swap/index.html
          put netlify/myvideo.html -o public_html/mylink/myvideo/index.html
          
          bye
          EOF
          
          echo "Frontend files uploaded!"

      - name: Verify deployment
        run: |
          echo "=== Verifying deployed files ==="
          sleep 3
          
          # Check myvideo page
          echo -n "  /mylink/myvideo/ → "
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 15 "https://www.mybait.org/mylink/myvideo/" 2>/dev/null || echo "000")
          echo "HTTP $CODE"
          
          # Check fundo page
          echo -n "  /mylink/fundo/ → "
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 15 "https://www.mybait.org/mylink/fundo/" 2>/dev/null || echo "000")
          echo "HTTP $CODE"
          
          # Check main page
          echo -n "  / → "
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 15 "https://www.mybait.org/" 2>/dev/null || echo "000")
          echo "HTTP $CODE"
          
          # Check API
          echo -n "  /api/v1/status → "
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 15 "https://www.mybait.org/api/v1/status" 2>/dev/null || echo "000")
          echo "HTTP $CODE"
          
          # Check myvideo API endpoint (may need daemon restart)
          echo ""
          echo "Waiting 15s for daemon to pick up new CGI..."
          sleep 15
          echo -n "  /api/v1/myvideo/status → "
          RESP=$(curl -s -m 15 "https://www.mybait.org/api/v1/myvideo/status" 2>/dev/null)
          if echo "$RESP" | grep -q "myvideo"; then
            echo "OK (myvideo system detected)"
            echo "$RESP" | python3 -m json.tool 2>/dev/null | head -12
          else
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 15 "https://www.mybait.org/api/v1/myvideo/status" 2>/dev/null || echo "000")
            echo "HTTP $CODE (may need daemon cold-start)"
          fi
          
          echo ""
          echo "══════════════════════════════════════════"
          echo "  MyVideo Deploy Complete!"
          echo "  https://www.mybait.org/mylink/myvideo/"
          echo "  https://www.mybait.org/mylink/fundo/"
          echo "  API: /api/v1/myvideo/orquestrar"
          echo "══════════════════════════════════════════"
