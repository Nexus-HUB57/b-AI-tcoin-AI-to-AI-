name: b'AI'tcoin Perpetual Autonomous Loop

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  perpetual-execution:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    - name: Instalar Dependencias
      run: |
        pip install ecdsa numpy
    - name: Executar Loop Perpetuo zkML
      run: |
        python core/loop_daemon.py