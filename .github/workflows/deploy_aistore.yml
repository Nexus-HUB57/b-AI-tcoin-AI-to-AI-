name: Deploy All to HostGator

on:
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'What to deploy'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - aistore-only
          - baitcoin-only
  repository_dispatch:
    types: [deploy-all]

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: hostgator-full-deploy
      cancel-in-progress: true

    steps:
      - name: Parse credentials
        env:
          HG_CREDS: ${{ secrets.CREDENCIAIS_HOSTGATOR }}
        run: |
          eval $(python3 -c "
          import os, json
          c = json.loads(os.environ['HG_CREDS'])
          print(f\"HOST={c.get('host','')}\")
          print(f\"USER={c.get('user','')}\")
          print(f\"PASS={c.get('password','')}\")
          print(f\"PORT={c.get('port', 21)}\")
          ")
          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$PASS" ]; then
            echo "::error::Missing credentials"; exit 1
          fi
          echo "HOST=$HOST" >> $GITHUB_ENV
          echo "USER=$USER" >> $GITHUB_ENV
          echo "PASS=$PASS" >> $GITHUB_ENV
          echo "PORT=$PORT" >> $GITHUB_ENV

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Set deploy flags
        id: flags
        run: |
          TARGET="${{ github.event.inputs.deploy_target || 'all' }}"
          DEPLOY_BAIT=false; DEPLOY_AI=false
          [ "$TARGET" != "aistore-only" ] && DEPLOY_BAIT=true
          [ "$TARGET" != "baitcoin-only" ] && DEPLOY_AI=true
          echo "deploy_bait=$DEPLOY_BAIT" >> $GITHUB_OUTPUT
          echo "deploy_aistore=$DEPLOY_AI" >> $GITHUB_OUTPUT
          echo "Deploy: bait=$DEPLOY_BAIT aistore=$DEPLOY_AI"

      # ═════════════════ b'AI'tcoin ═════════════════
      - name: Checkout b'AI'tcoin
        if: steps.flags.outputs.deploy_bait == 'true'
        uses: actions/checkout@v4

      - name: Deploy b'AI'tcoin
        if: steps.flags.outputs.deploy_bait == 'true'
        run: |
          # Frontend
          mkdir -p /tmp/deploy-bait
          cp netlify/index.html /tmp/deploy-bait/ 2>/dev/null || true
          cp netlify/.htaccess /tmp/deploy-bait/ 2>/dev/null || true
          cp docs/whitepaper/bAIcoin_Whitepaper.pdf /tmp/deploy-bait/ 2>/dev/null || true

          lftp -u "$USER","$PASS" -p "$PORT" "$HOST" <<EOF
          set ftp:ssl-force true
          set ssl:verify-certificate no
          set net:timeout 30
          mirror --reverse --overwrite --no-perms /tmp/deploy-bait/ public_html/
          bye
          EOF

          # Codebase + CGI
          tar czf /tmp/bait-codebase.tar.gz \
            --exclude='.git' --exclude='__pycache__' --exclude='.pytest_cache' \
            --exclude='*.pyc' --exclude='baitcoin_data' --exclude='.venv' \
            --exclude='baitcoin-repo' .

          lftp -u "$USER","$PASS" -p "$PORT" "$HOST" <<EOF
          set ftp:ssl-force true
          set ssl:verify-certificate no
          set net:timeout 90
          put /tmp/bait-codebase.tar.gz -o public_html/codebase.tar.gz
          put /tmp/bait-codebase.tar.gz -o public_html/baitcoin-codebase.tar.gz
          put netlify/api.cgi -o public_html/api.cgi
          chmod 755 public_html/api.cgi
          bye
          EOF
          echo "[+] b'AI'tcoin deployed"

      # ═════════════════ AI Store ═════════════════
      - name: Checkout AI Store
        if: steps.flags.outputs.deploy_aistore == 'true'
        uses: actions/checkout@v4
        with:
          repository: Nexus-HUB57/AI_Store
          path: aistore

      - name: Setup Node.js
        if: steps.flags.outputs.deploy_aistore == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build AI Store
        if: steps.flags.outputs.deploy_aistore == 'true'
        env:
          DATABASE_URL: file:/home/runner/work/b-AI-tcoin-AI-to-AI-/b-AI-tcoin-AI-to-AI-/aistore/db/custom.db
        run: |
          cd aistore
          npm ci 2>&1 | tail -3
          npx prisma generate

          # Seed DB if empty
          COUNT=$(node -e "const{PrismaClient}=require('@prisma/client');new PrismaClient().product.count().then(c=>{console.log(c);process.exit(c>0?0:1)})" 2>/dev/null || echo "0")
          if [ "$COUNT" = "0" ]; then
            echo "[+] Seeding 1504 products..."
            npx tsx scripts/seed-full.ts
          fi

          # Build
          NODE_ENV=production \
          NEXT_PUBLIC_BASE_PATH=/aistore \
          NEXT_PUBLIC_BASE_URL=https://www.mybait.org/aistore \
          npx next build 2>&1 | tail -15

          # Package
          mkdir -p /tmp/aistore-pkg/standalone
          cp -r .next/standalone/* /tmp/aistore-pkg/standalone/
          mkdir -p /tmp/aistore-pkg/standalone/.next/static
          cp -r .next/static/* /tmp/aistore-pkg/standalone/.next/static/
          mkdir -p /tmp/aistore-pkg/standalone/public
          cp -r public/* /tmp/aistore-pkg/standalone/public/ 2>/dev/null || true
          mkdir -p /tmp/aistore-pkg/standalone/{prisma,db}
          cp prisma/schema.prisma /tmp/aistore-pkg/standalone/prisma/
          cp db/custom.db /tmp/aistore-pkg/standalone/db/
          cp package.json /tmp/aistore-pkg/standalone/
          cp hostgator/api.cgi /tmp/aistore-pkg/
          cp hostgator/.htaccess /tmp/aistore-pkg/
          cp hostgator/setup_aistore.sh /tmp/aistore-pkg/
          chmod +x /tmp/aistore-pkg/api.cgi /tmp/aistore-pkg/setup_aistore.sh

          cd /tmp/aistore-pkg/standalone
          tar czf /tmp/aistore-codebase.tar.gz .
          echo "[+] Package: $(du -h /tmp/aistore-codebase.tar.gz | cut -f1)"

      - name: Upload AI Store
        if: steps.flags.outputs.deploy_aistore == 'true'
        run: |
          lftp -u "$USER","$PASS" -p "$PORT" "$HOST" <<EOF
          set ftp:ssl-force true
          set ssl:verify-certificate no
          set net:timeout 180

          mkdir -p public_html/aistore

          put /tmp/aistore-pkg/api.cgi -o public_html/aistore/api.cgi
          chmod 755 public_html/aistore/api.cgi

          put /tmp/aistore-pkg/.htaccess -o public_html/aistore/.htaccess
          put /tmp/aistore-pkg/setup_aistore.sh -o public_html/aistore/setup_aistore.sh
          chmod 755 public_html/aistore/setup_aistore.sh

          put /tmp/aistore-codebase.tar.gz -o public_html/aistore-codebase.tar.gz

          bye
          EOF
          echo "[+] AI Store uploaded"

      # ═════════════════ ROOT .htaccess ═════════════════
      - name: Update root .htaccess
        run: |
          cat > /tmp/root_htaccess << 'HT'
          Options +ExecCGI
          AddHandler cgi-script .cgi
          <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteCond %{REQUEST_URI} !^/aistore
            RewriteRule ^api/(.*)$ /api.cgi/$1 [QSA,L,E=PATH_INFO:/$1]
          </IfModule>
          <IfModule mod_headers.c>
            Header set X-Frame-Options "DENY"
            Header set X-Content-Type-Options "nosniff"
          </IfModule>
          <IfModule mod_deflate.c>
            AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json
          </IfModule>
          <IfModule mod_expires.c>
            ExpiresActive On
            ExpiresByType application/pdf "access plus 1 month"
          </IfModule>
          ErrorDocument 404 /index.html
          HT

          lftp -u "$USER","$PASS" -p "$PORT" "$HOST" <<EOF
          set ftp:ssl-force true
          set ssl:verify-certificate no
          set net:timeout 30
          put /tmp/root_htaccess -o public_html/.htaccess
          bye
          EOF
          echo "[+] Root .htaccess updated"

      # ═════════════════ VERIFICATION ═════════════════
      - name: Verify
        if: always()
        run: |
          echo ""
          echo "========== VERIFICATION =========="
          echo -n "  b'AI'tcoin: "
          curl -s -o /dev/null -w "HTTP %{http_code}\n" --max-time 10 "https://www.mybait.org/" 2>/dev/null || echo "TIMEOUT"
          echo -n "  b'AI't API: "
          curl -s -o /dev/null -w "HTTP %{http_code}\n" --max-time 15 "https://www.mybait.org/api/api/v1/status" 2>/dev/null || echo "TIMEOUT"
          echo -n "  AI Store:   "
          curl -s -o /dev/null -w "HTTP %{http_code}\n" --max-time 30 "https://www.mybait.org/aistore/" 2>/dev/null || echo "TIMEOUT (setup)"
          echo ""
          echo "  https://www.mybait.org/aistore/"
          echo "  https://www.mybait.org/aistore/api/health"
