name: Deploy All to HostGator

on:
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'What to deploy'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - aistore-only
          - baitcoin-only
  repository_dispatch:
    types: [deploy-all]

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: hostgator-full-deploy
      cancel-in-progress: true

    steps:
      - name: Parse credentials
        env:
          HG_CREDS: ${{ secrets.CREDENCIAIS_HOSTGATOR }}
        run: |
          eval $(python3 -c "
          import os, json
          c = json.loads(os.environ['HG_CREDS'])
          print(f\"HOST={c.get('host','')}\")
          print(f\"USER={c.get('user','')}\")
          print(f\"PASS={c.get('password','')}\")
          print(f\"PORT={c.get('port', 21)}\")
          ")
          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$PASS" ]; then
            echo "::error::Missing credentials"; exit 1
          fi
          echo "HOST=$HOST" >> $GITHUB_ENV
          echo "USER=$USER" >> $GITHUB_ENV
          echo "PASS=$PASS" >> $GITHUB_ENV
          echo "PORT=$PORT" >> $GITHUB_ENV
          echo "[+] Parsed: $HOST:$PORT user=${#USER}c"

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # Determine what to deploy
      - name: Set deploy flags
        id: flags
        run: |
          TARGET="${{ github.event.inputs.deploy_target || 'all' }}"
          echo "deploy_bait=$( [[ '$TARGET' != 'aistore-only' ]] && echo 'true' || echo 'false' )" >> $GITHUB_OUTPUT
          echo "deploy_aistore=$( [[ '$TARGET' != 'baitcoin-only' ]] && echo 'true' || echo 'false' )" >> $GITHUB_OUTPUT
          echo "Deploy target: $TARGET"

      # ═══════════════════════════════════════════════════════════
      # b'AI'tcoin DEPLOY
      # ═══════════════════════════════════════════════════════════
      - name: Checkout b'AI'tcoin
        if: steps.flags.outputs.deploy_bait == 'true'
        uses: actions/checkout@v4

      - name: Deploy b'AI'tcoin
        if: steps.flags.outputs.deploy_bait == 'true'
        run: |
          mkdir -p deploy-frontend/
          cp netlify/index.html deploy-frontend/index.html 2>/dev/null || true
          cp netlify/.htaccess deploy-frontend/.htaccess 2>/dev/null || true
          cp docs/whitepaper/bAIcoin_Whitepaper.pdf deploy-frontend/whitepaper.pdf 2>/dev/null || true

          lftp -u "$USER","$PASS" -p "$PORT" "$HOST" <<LFTP_EOF
          set ftp:ssl-force true
          set ssl:verify-certificate no
          set net:timeout 30
          mirror --reverse --overwrite --verbose --no-perms deploy-frontend/ public_html/
          bye
          LFTP_EOF

          tar czf /tmp/baitcoin-codebase.tar.gz \
            --exclude='.git' --exclude='__pycache__' --exclude='.pytest_cache' \
            --exclude='*.pyc' --exclude='baitcoin_data' --exclude='.venv' .

          lftp -u "$USER","$PASS" -p "$PORT" "$HOST" <<LFTP_EOF
          set ftp:ssl-force true
          set ssl:verify-certificate no
          set net:timeout 60
          put /tmp/baitcoin-codebase.tar.gz -o public_html/codebase.tar.gz
          put /tmp/baitcoin-codebase.tar.gz -o public_html/baitcoin-codebase.tar.gz
          put netlify/api.cgi -o public_html/api.cgi
          chmod 755 public_html/api.cgi
          bye
          LFTP_EOF
          echo "[+] b'AI'tcoin deployed"

      # ═══════════════════════════════════════════════════════════
      # AI Store DEPLOY
      # ═══════════════════════════════════════════════════════════
      - name: Checkout AI Store
        if: steps.flags.outputs.deploy_aistore == 'true'
        uses: actions/checkout@v4
        with:
          repository: Nexus-HUB57/AI_Store
          path: aistore
          token: ${{ secrets.CREDENCIAIS_HOSTGATOR }}

      - name: Build AI Store
        if: steps.flags.outputs.deploy_aistore == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build and package AI Store
        if: steps.flags.outputs.deploy_aistore == 'true'
        run: |
          cd aistore
          npm ci 2>&1 | tail -3
          npx prisma generate

          # Seed DB if empty
          COUNT=$(node -e "const{PrismaClient}=require('@prisma/client');new PrismaClient().product.count().then(c=>{console.log(c);process.exit(c>0?0:1)})" 2>/dev/null || echo "0")
          if [ "$COUNT" = "0" ]; then
            echo "[+] Seeding 1504 products..."
            npx tsx scripts/seed-full.ts
          fi

          NODE_ENV=production \
          NEXT_PUBLIC_BASE_PATH=/aistore \
          NEXT_PUBLIC_BASE_URL=https://www.mybait.org/aistore \
          npx next build 2>&1 | tail -15

          mkdir -p pkg/standalone
          cp -r .next/standalone/* pkg/standalone/
          mkdir -p pkg/standalone/.next/static
          cp -r .next/static/* pkg/standalone/.next/static/
          mkdir -p pkg/standalone/public
          cp -r public/* pkg/standalone/public/ 2>/dev/null || true
          mkdir -p pkg/standalone/{prisma,db}
          cp prisma/schema.prisma pkg/standalone/prisma/
          cp db/custom.db pkg/standalone/db/
          cp package.json pkg/standalone/
          cp hostgator/api.cgi hostgator/.htaccess hostgator/setup_aistore.sh pkg/
          chmod +x pkg/api.cgi pkg/setup_aistore.sh

          cd pkg/standalone && tar czf ../aistore-codebase.tar.gz .
          echo "[+] Package: $(du -h pkg/aistore-codebase.tar.gz | cut -f1)"

      - name: Upload AI Store to HostGator
        if: steps.flags.outputs.deploy_aistore == 'true'
        run: |
          cd aistore/pkg

          lftp -u "$USER","$PASS" -p "$PORT" "$HOST" <<LFTP_EOF
          set ftp:ssl-force true
          set ssl:verify-certificate no
          set net:timeout 120

          mkdir -p public_html/aistore

          put api.cgi -o public_html/aistore/api.cgi
          chmod 755 public_html/aistore/api.cgi

          put .htaccess -o public_html/aistore/.htaccess
          put setup_aistore.sh -o public_html/aistore/setup_aistore.sh
          chmod 755 public_html/aistore/setup_aistore.sh

          put aistore-codebase.tar.gz -o public_html/aistore-codebase.tar.gz

          bye
          LFTP_EOF
          echo "[+] AI Store uploaded"

      # ═══════════════════════════════════════════════════════════
      # ROOT .htaccess UPDATE
      # ═══════════════════════════════════════════════════════════
      - name: Update root .htaccess
        run: |
          cat > /tmp/root_htaccess << 'HTEOF'
          # b'AI'tcoin + AI Store — Combined Root .htaccess
          <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteCond %{REQUEST_URI} !^/aistore
            RewriteRule ^api/(.*)$ /api.cgi/$1 [QSA,L,E=PATH_INFO:/$1]
          </IfModule>
          <IfModule mod_headers.c>
            Header set X-Frame-Options "DENY"
            Header set X-Content-Type-Options "nosniff"
          </IfModule>
          <IfModule mod_deflate.c>
            AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json
          </IfModule>
          <IfModule mod_expires.c>
            ExpiresActive On
            ExpiresByType application/pdf "access plus 1 month"
          </IfModule>
          ErrorDocument 404 /index.html
          HTEOF

          lftp -u "$USER","$PASS" -p "$PORT" "$HOST" <<LFTP_EOF
          set ftp:ssl-force true
          set ssl:verify-certificate no
          set net:timeout 30
          put -o public_html/.htaccess /tmp/root_htaccess
          bye
          LFTP_EOF
          echo "[+] Root .htaccess updated"

      # ═══════════════════════════════════════════════════════════
      # VERIFICATION
      # ═══════════════════════════════════════════════════════════
      - name: Verify
        if: always()
        run: |
          echo ""
          echo "========== VERIFICATION =========="
          echo -n "  b'AI'tcoin landing: "; curl -s -o /dev/null -w "HTTP %{http_code}\n" --max-time 10 "https://www.mybait.org/" 2>/dev/null || echo "TIMEOUT"
          echo -n "  b'AI'tcoin API:    "; curl -s -o /dev/null -w "HTTP %{http_code}\n" --max-time 15 "https://www.mybait.org/api/api/v1/status" 2>/dev/null || echo "TIMEOUT"
          echo -n "  AI Store:          "; curl -s -o /dev/null -w "HTTP %{http_code}\n" --max-time 30 "https://www.mybait.org/aistore/" 2>/dev/null || echo "TIMEOUT (first hit triggers setup)"
          echo ""
          echo "  Store:   https://www.mybait.org/aistore/"
          echo "  Health:  https://www.mybait.org/aistore/api/health"
          echo "  b'AI't:  https://www.mybait.org/api/api/v1/status"
