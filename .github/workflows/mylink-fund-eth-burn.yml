name: MyLink Fund — ETH Gas Burn (BAITHex Sweep Validation)

# Manual trigger only. This workflow:
#   1. Loads the ETH keystore from GitHub Actions Secret KEYSTORE_ETH_FUNDO_MYLINK
#   2. Decrypts it with KEYSTORE_ETH_FUNDO_MYLINK_PASSWORD (in memory only)
#   3. Connects to ETH_RPC_URL (Infura / Alchemy / self-hosted)
#   4. Validates chain_id, balance, gas price, nonce
#   5. If MYLINK_FUND_ETH_BURN_ARMED="true", signs + broadcasts the burn tx
#
# By default runs in DRY-RUN mode (armed=false) — it never broadcasts.
# Set ARMED via workflow_dispatch input.

on:
  workflow_dispatch:
    inputs:
      arm:
        description: "ARM the workflow (broadcast real tx)?"
        required: true
        type: choice
        default: "false"
        options:
          - "false"
          - "true"
      burn_amount_wei:
        description: "Burn amount in wei (default 0)"
        required: false
        type: string
        default: "0"
      burn_address:
        description: "Burn destination (default 0x000...dEaD)"
        required: false
        type: string
        default: "0x000000000000000000000000000000000000dEaD"
      min_balance_wei:
        description: "Abort if post-burn balance falls below this (wei)"
        required: false
        type: string
        default: "0"

concurrency:
  group: mylink-fund-eth-burn
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  validate-and-burn:
    name: Validate + (optionally) burn
    runs-on: ubuntu-latest
    environment: mylink-fund-prod  # gated by GitHub Environment protection rules
    timeout-minutes: 10

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # CRITICAL: never persist credentials after checkout
          persist-credentials: false

      # ── 2. Setup Python ────────────────────────────────────────────────
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # ── 3. Install deps ────────────────────────────────────────────────
      - name: Install signing deps
        run: |
          python -m pip install --upgrade pip
          # cryptography is in requirements.txt
          pip install "eth-account>=0.13" "pycryptodome>=3.18"

      # ── 4. gitleaks pre-flight (defense in depth) ────────────────────
      - name: gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        continue-on-error: true

      # ── 5. Validate keystore env var is parseable but NEVER log it ───
      - name: Validate keystore secret shape
        env:
          KEYSTORE: ${{ secrets.KEYSTORE_ETH_FUNDO_MYLINK }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::KEYSTORE_ETH_FUNDO_MYLINK is empty"
            exit 2
          fi
          # Quick shape check (no full parse — that's the script's job)
          case "$KEYSTORE" in
            "{"*"}")
              echo "✓ keystore looks like inline JSON" ;;
            *)
              echo "✓ keystore looks like a path: $KEYSTORE" ;;
          esac

      # ── 6. Run the burn workflow ──────────────────────────────────────
      - name: Run burn workflow
        env:
          # Secrets — NEVER echoed, NEVER logged
          KEYSTORE_ETH_FUNDO_MYLINK: ${{ secrets.KEYSTORE_ETH_FUNDO_MYLINK }}
          KEYSTORE_ETH_FUNDO_MYLINK_PASSWORD: ${{ secrets.KEYSTORE_ETH_FUNDO_MYLINK_PASSWORD }}
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}

          # Inputs
          MYLINK_FUND_ETH_BURN_ARMED: ${{ github.event.inputs.arm }}
          ETH_BURN_AMOUNT_WEI: ${{ github.event.inputs.burn_amount_wei }}
          ETH_BURN_ADDRESS: ${{ github.event.inputs.burn_address }}
          ETH_MIN_BALANCE_WEI: ${{ github.event.inputs.min_balance_wei }}
          ETH_EXPECTED_CHAIN_ID: "1"
        run: |
          python ops/mylink_fund_eth_burn.py

      # ── 7. Job summary (no secrets) ───────────────────────────────────
      - name: Write job summary
        if: always()
        run: |
          {
            echo "## MyLink Fund — ETH Gas Burn"
            echo ""
            echo "- ARMED: \`${{ github.event.inputs.arm }}\`"
            echo "- Burn address: \`${{ github.event.inputs.burn_address }}\`"
            echo "- Burn amount: \`${{ github.event.inputs.burn_amount_wei }}\` wei"
            echo "- Job result: ${{ job.status }}"
            echo ""
            echo "::warning::This summary intentionally omits txhash, address and any secret material."
          } >> "$GITHUB_STEP_SUMMARY"
