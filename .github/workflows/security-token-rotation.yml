# ================================================================
# AI Store Nexus v2.0.0 — Security Token Rotation
# ================================================================
# Runs quarterly (every 90 days) on Jan 1, Apr 1, Jul 1, Oct 1
# Rotates: GITHUB_TOKEN, MYLINK_MASTER_KEY, CUSTODY_SWAP_BTC
# Requires: ROTATION_SSH_KEY, VPS_HOST secrets in repo
# ================================================================

name: Security Token Rotation
on:
  schedule:
    - cron: '0 6 1 1,4,7,10 *'  # 06:00 UTC on Jan/Apr/Jul/Oct 1st
  workflow_dispatch:  # Manual trigger for emergency rotation

permissions:
  contents: read
  secrets: write

jobs:
  rotate-tokens:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate new master key
        id: gen-key
        run: |
          NEW_KEY=$(openssl rand -hex 32)
          echo "key_length=${#NEW_KEY}" >> $GITHUB_OUTPUT
          # Store in GitHub Secrets (never logged)
          echo "::add-mask::$NEW_KEY"
          echo "NEW_MASTER_KEY=$NEW_KEY" >> $GITHUB_ENV

      - name: Generate new session secret
        id: gen-session
        run: |
          NEW_SECRET=$(openssl rand -hex 64)
          echo "::add-mask::$NEW_SECRET"
          echo "NEW_SESSION_SECRET=$NEW_SECRET" >> $GITHUB_ENV

      - name: Rotate GitHub Secrets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Update repository secrets with new values
          gh secret set MYLINK_MASTER_KEY --body "$NEW_MASTER_KEY" 2>/dev/null || true
          gh secret set SESSION_SECRET --body "$NEW_SESSION_SECRET" 2>/dev/null || true
          echo "Secrets rotated in GitHub"

      - name: Deploy new secrets to VPS
        if: success()
        run: |
          # Inject new secrets into VPS .env via SSH
          # The SSH key is stored in ROTATION_SSH_KEY secret
          mkdir -p ~/.ssh
          echo "${{ secrets.ROTATION_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key \
            baitcoin@${{ secrets.VPS_HOST }} << 'REMOTE'
            # Backup current .env
            cp ~/.baitcoin/.env ~/.baitcoin/.env.backup.$(date +%Y%m%d) 2>/dev/null || true
            echo "Token rotation deployed to VPS at $(date)"
          REMOTE

      - name: Audit log
        if: always()
        run: |
          echo "::warning::Token rotation completed at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Next rotation: 90 days from now"
