name: Mainnet Readiness Gate

on:
  workflow_dispatch:
    inputs:
      min_peers:
        description: Minimum live P2P peers with handshake
        required: true
        default: '3'
        type: string

permissions:
  contents: read

jobs:
  readiness:
    name: Read-only Mainnet readiness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout audited revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run fail-closed gate
        env:
          MAINNET_API_BASE_URL: ${{ vars.MAINNET_API_BASE_URL }}
          ETH_RPC_URL: ${{ vars.ETH_RPC_URL }}
          MIN_PEERS: ${{ inputs.min_peers }}
        run: |
          set -euo pipefail
          test -n "$MAINNET_API_BASE_URL"
          test -n "$ETH_RPC_URL"
          python3 scripts/mainnet_readiness_gate.py \
            --base-url "$MAINNET_API_BASE_URL" \
            --eth-rpc "$ETH_RPC_URL" \
            --min-peers "$MIN_PEERS" | tee readiness.json

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mainnet-readiness-evidence
          path: readiness.json
          if-no-files-found: ignore
