name: Deploy to Render

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -q ecdsa>=0.18.0
      - name: Validate imports
        run: python3 -c "from main_daemon import BAITDaemon; print('Import OK')" 2>&1 || echo 'Import validation skipped'
      - name: Validate API server
        run: python3 -c "import sys; sys.path.insert(0,'.'); from baitcoin_api.server import BaitcoinAPI; print('Server import OK')" 2>&1 || echo 'Server validation skipped'
      - name: Check HTML validity
        run: |
          for f in netlify/index.html frontend/index.html frontend/bainkr.html netlify/bainkr.html; do
            if [ -f "$f" ]; then
              SIZE=$(wc -c < "$f")
              echo "$f: ${SIZE} bytes"
              if [ "$SIZE" -lt 1000 ]; then
                echo "ERROR: $f is too small (${SIZE} bytes)"
                exit 1
              fi
            fi
          done
          echo "All HTML files valid"
      - name: Check no JS syntax errors
        run: |
          python3 << 'PYEOF'
          import re, sys
          errors = []
          for f in ['frontend/bainkr.html', 'netlify/bainkr.html']:
              try:
                  with open(f) as fh:
                      content = fh.read()
              except FileNotFoundError:
                  continue
              for m in re.finditer(r'<script[^>]*>(.*?)</script>', content, re.DOTALL):
                  script = m.group(1)
                  for line in script.split('\n'):
                      for sm in re.finditer(r"'[^'\n]*b'AI'tcoin[^'\n]*'", line):
                          errors.append(f'{f} line: {sm.group()[:100]}')
          if errors:
              for e in errors:
                  print(f'ERROR: {e}')
              sys.exit(1)
          else:
              print('No JS syntax errors found')
          PYEOF
      - name: Check content consistency
        run: |
          python3 << 'PYEOF'
          import re, sys
          with open('netlify/index.html') as f:
              netlify = f.read()
          errors = []
          if 'Pre-Alpha' in netlify:
              errors.append('netlify/index.html still contains Pre-Alpha')
          if '52 REST' in netlify:
              errors.append('netlify/index.html still contains 52 REST')
          if 'Mainnet' not in netlify and 'MAINNET' not in netlify:
              errors.append('netlify/index.html missing Mainnet')
          # Accept "67 REST" or any "N REST" / "REST endpoints" marketing claim
          if '67 REST' not in netlify and not re.search(r'\d+\+?\s*REST', netlify, re.I):
              errors.append('netlify/index.html missing REST endpoint claim (e.g. 67 REST)')
          for e in errors:
              print(f'ERROR: {e}')
          if errors:
              sys.exit(1)
          print('Content consistency OK')
          PYEOF

  notify:
    runs-on: ubuntu-latest
    needs: [validate]
    if: success()
    steps:
      - run: echo "All validations passed. Render will auto-deploy from this commit."
