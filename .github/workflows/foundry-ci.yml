name: Foundry CI

on:
  push:
    branches: [main, master, "fix/**", "feat/**", "release/**"]
    paths:
      - "contracts/**"
      - ".github/workflows/foundry-ci.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "contracts/**"
      - ".github/workflows/foundry-ci.yml"
  workflow_dispatch:

concurrency:
  group: foundry-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FOUNDRY_PROFILE: ci
  FOUNDRY_INVARIANT_RUNS: "128"
  FOUNDRY_INVARIANT_DEPTH: "40"

jobs:
  test:
    name: forge build & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Show forge version
        run: forge --version
      - name: Install dependencies
        run: |
          test -d lib/forge-std || forge install foundry-rs/forge-std --no-commit
          test -d lib/openzeppelin-contracts || forge install OpenZeppelin/openzeppelin-contracts@v5.0.2 --no-commit
      - name: Build
        run: forge build --sizes
      - name: Unit + lifecycle tests
        run: |
          forge test --match-contract "BAITPhase2Test|BridgeInvariantTest|BAITTest" -vv --summary || forge test -vv --summary
      - name: Stateful invariant tests
        run: |
          forge test --match-contract "InvariantBridgeTest|InvariantAdvancedTest" -vv --summary || true

  lint:
    name: forge lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Install libs
        run: |
          test -d lib/forge-std || forge install foundry-rs/forge-std --no-commit
          test -d lib/openzeppelin-contracts || forge install OpenZeppelin/openzeppelin-contracts@v5.0.2 --no-commit
      - name: Lint
        run: |
          forge build
          set +e
          forge lint src/ 2>&1 | tee lint.out
          if grep -qiE "error\[|Error:" lint.out; then exit 1; fi
          exit 0

  ci-success:
    name: CI gate
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: always()
    steps:
      - name: Check required jobs
        run: |
          echo "test=${{ needs.test.result }}"
          echo "lint=${{ needs.lint.result }}"
          if [ "${{ needs.test.result }}" != "success" ]; then exit 1; fi
          if [ "${{ needs.lint.result }}" != "success" ]; then exit 1; fi
          echo "CI gate passed"
