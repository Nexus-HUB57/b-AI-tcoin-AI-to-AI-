name: Foundry CI

on:
  push:
    branches: [main, master, "fix/**", "feat/**", "release/**"]
    paths:
      - "contracts/**"
      - ".github/workflows/foundry-ci.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "contracts/**"
      - ".github/workflows/foundry-ci.yml"
  workflow_dispatch:

concurrency:
  group: foundry-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FOUNDRY_PROFILE: ci
  FOUNDRY_INVARIANT_RUNS: "64"
  FOUNDRY_INVARIANT_DEPTH: "32"

jobs:
  test:
    name: forge build & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Show forge version
        run: forge --version
      - name: Install dependencies
        run: |
          test -d lib/forge-std || forge install foundry-rs/forge-std --no-commit
          test -d lib/openzeppelin-contracts || forge install OpenZeppelin/openzeppelin-contracts@v5.0.2 --no-commit
      - name: Build (skip legacy scripts not yet Phase-2 updated)
        run: |
          forge build --sizes \
            --skip script/DeployBAITAnvil.s.sol \
            --skip script/DeployBAITSepolia.s.sol \
            --skip script/DeployBAITMainnet.s.sol \
            --skip script/DeployBAIT.s.sol \
            --skip script/TestBridgeLifecycle.s.sol \
            --skip script/TestBridgeLifecycleAnvil.s.sol \
            --skip script/VerifyBAIT.s.sol
      - name: Unit + lifecycle tests
        run: |
          forge test \
            --match-contract "WBAITTest|BridgeLockTest|BAITPhase2Test|BridgeInvariantTest" \
            -vv --summary \
            --skip script/DeployBAITAnvil.s.sol \
            --skip script/DeployBAITSepolia.s.sol \
            --skip script/DeployBAITMainnet.s.sol \
            --skip script/DeployBAIT.s.sol \
            --skip script/TestBridgeLifecycle.s.sol \
            --skip script/TestBridgeLifecycleAnvil.s.sol \
            --skip script/VerifyBAIT.s.sol
      - name: Stateful invariant tests
        run: |
          forge test --match-contract "InvariantBridgeTest|InvariantAdvancedTest" -vv --summary \
            --skip script/DeployBAITAnvil.s.sol \
            --skip script/DeployBAITSepolia.s.sol \
            --skip script/DeployBAITMainnet.s.sol \
            --skip script/DeployBAIT.s.sol \
            --skip script/TestBridgeLifecycle.s.sol \
            --skip script/TestBridgeLifecycleAnvil.s.sol \
            --skip script/VerifyBAIT.s.sol || true
      - name: Coverage summary (advisory)
        continue-on-error: true
        run: |
          forge coverage --report summary \
            --match-contract "WBAITTest|BridgeLockTest|BAITPhase2Test|BridgeInvariantTest" \
            --skip script/DeployBAITAnvil.s.sol \
            --skip script/DeployBAITSepolia.s.sol \
            --skip script/DeployBAITMainnet.s.sol \
            --skip script/DeployBAIT.s.sol \
            --skip script/TestBridgeLifecycle.s.sol \
            --skip script/TestBridgeLifecycleAnvil.s.sol \
            --skip script/VerifyBAIT.s.sol || true

  lint:
    name: forge lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Install libs
        run: |
          test -d lib/forge-std || forge install foundry-rs/forge-std --no-commit
          test -d lib/openzeppelin-contracts || forge install OpenZeppelin/openzeppelin-contracts@v5.0.2 --no-commit
      - name: Lint src only
        run: |
          forge build --skip script --skip test
          set +e
          forge lint src/ 2>&1 | tee lint.out
          if grep -qiE "error\[|Error:" lint.out; then exit 1; fi
          exit 0

  # Slither: run analysis without ignore-compile (avoids KeyError: 'output' on Foundry 1.x artifacts).
  # continue-on-error until High findings are triage policy; CI gate does not depend on this job.
  slither:
    name: Slither static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Install libs
        run: |
          test -d lib/forge-std || forge install foundry-rs/forge-std --no-commit
          test -d lib/openzeppelin-contracts || forge install OpenZeppelin/openzeppelin-contracts@v5.0.2 --no-commit
      - name: Run Slither (Foundry framework, no ignore-compile)
        uses: crytic/slither-action@v0.4.0
        with:
          target: contracts/
          fail-on: high
          # Do NOT set ignore-compile — let crytic-compile invoke forge (avoids KeyError: output)
          slither-args: >-
            --filter-paths "lib|node_modules|script|test"
            --exclude naming-convention,solc-version,low-level-calls,external-function,solc-version

  ci-success:
    name: CI gate
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: always()
    steps:
      - name: Check required jobs
        run: |
          echo "test=${{ needs.test.result }}"
          echo "lint=${{ needs.lint.result }}"
          if [ "${{ needs.test.result }}" != "success" ]; then exit 1; fi
          if [ "${{ needs.lint.result }}" != "success" ]; then exit 1; fi
          echo "CI gate passed"
