name: Foundry CI

on:
  push:
    branches: [main]
    paths:
      - 'contracts/**'
  pull_request:
    branches: [main]
    paths:
      - 'contracts/**'

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    name: Foundry CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Build contracts
        run: forge build

      - name: Run tests
        run: forge test -vvv

      - name: Run fuzz tests
        run: forge test --fuzz-runs 1024

      - name: Generate gas report
        run: forge test --gas-report > gas-report.txt
        continue-on-error: true

      - name: Check contract sizes
        run: forge build --sizes
        continue-on-error: true

      - name: Upload gas report
        uses: actions/upload-artifact@v4
        with:
          name: gas-report
          path: contracts/gas-report.txt
        continue-on-error: true

  slither:
    name: Slither Analysis
    runs-on: ubuntu-latest
    needs: check
    defaults:
      run:
        working-directory: contracts

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install Slither
        run: pip3 install slither-analyzer

      - name: Run Slither
        run: |
          slither . --foundry-compile-all --exclude-dependencies \
            --exclude naming-convention,unused-state \
            --json slither-report.json || true

      - name: Check for High/Medium findings
        run: |
          if [ -f slither-report.json ]; then
            HIGH=$(python3 -c "import json; d=json.load(open('slither-report.json')); print(sum(1 for r in d.get('results',{}).get('detectors',[]) if r.get('impact','') in ['High','Medium']))")
            if [ "$HIGH" -gt 0 ]; then
              echo "CRITICAL: $HIGH High/Medium findings found!"
              exit 1
            fi
            echo "OK: No High/Medium findings"
          fi

      - name: Upload Slither report
        uses: actions/upload-artifact@v4
        with:
          name: slither-report
          path: contracts/slither-report.json
        continue-on-error: true
