name: Deploy Moltbook Nginx Proxy

# Adds /moltbook/ location to VPS nginx config
# proxying to cPanel Apache (108.167.132.234) which already serves Moltbook

on:
  workflow_dispatch:

jobs:
  add-nginx-proxy:
    name: Add Moltbook nginx proxy on VPS
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          cat >> ~/.ssh/config << EOF
          Host vps
            HostName ${{ secrets.VPS_HOST }}
            Port ${{ secrets.VPS_PORT }}
            User ${{ secrets.VPS_USER }}
            IdentityFile ~/.ssh/vps_key
            StrictHostKeyChecking no
            ConnectTimeout 10
          EOF

      - name: Add Moltbook proxy location
        run: |
          ssh vps 'bash -s' << 'REMOTE_SCRIPT'
          set -euo pipefail

          CONF="/etc/nginx/sites-available/mybait.conf"
          if [ ! -f "$CONF" ]; then
            CONF="/etc/nginx/conf.d/mybait.conf"
          fi
          if [ ! -f "$CONF" ]; then
            CONF=$(find /etc/nginx -name "*.conf" -exec grep -l "mybait" {} \; | head -1)
          fi

          echo "Using config: $CONF"

          # Check if moltbook location already exists
          if grep -q 'moltbook' "$CONF" 2>/dev/null; then
            echo "Moltbook location already exists in $CONF - skipping"
            exit 0
          fi

          # Create a temp file with the proxy block inserted before the last }
          TMP=$(mktemp)
          awk '
          BEGIN { found=0 }
          {
            buf = buf $0 ORS
          }
          /^}$/ && !found {
            # This is the last closing brace - insert proxy block before it
            sub(/\n$/, "", buf)
            print buf
            print ""
            print "    location /moltbook/ {"
            print "        proxy_pass http://108.167.132.234/moltbook/;"
            print "        proxy_set_header Host mybait.org;"
            print "        proxy_set_header X-Real-IP $remote_addr;"
            print "        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;"
            print "        proxy_set_header X-Forwarded-Proto $scheme;"
            print "    }"
            print "}"
            buf = ""
            found = 1
          }
          END {
            if (buf != "") printf "%s", buf
          }
          ' "$CONF" > "$TMP"

          # Validate the new config
          nginx -t -c "$TMP" 2>&1 || { echo "nginx -t failed, keeping old config"; rm "$TMP"; exit 1; }

          # Replace the config
          cp "$TMP" "$CONF"
          rm "$TMP"

          # Test and reload
          nginx -t
          systemctl reload nginx

          echo "Moltbook proxy added and nginx reloaded"
          REMOTE_SCRIPT

      - name: Verify Moltbook accessible
        run: |
          sleep 2
          HTTP_CODE=$(curl -sS --max-time 10 -o /dev/null -w "%{http_code}" "https://mybait.org/moltbook/" 2>/dev/null || echo "000")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "Moltbook accessible via VPS nginx (HTTP $HTTP_CODE)"
          else
            echo "Moltbook returned HTTP $HTTP_CODE - may need manual nginx reload"
          fi
