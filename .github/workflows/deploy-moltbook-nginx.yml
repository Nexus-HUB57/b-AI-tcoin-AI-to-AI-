name: Deploy Moltbook Nginx Proxy

# Adds /moltbook/ location to VPS nginx config
# proxying to cPanel Apache (108.167.132.234) which already serves Moltbook

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/moltbook/**'

jobs:
  add-nginx-proxy:
    name: Add Moltbook nginx proxy on VPS
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          cat >> ~/.ssh/config << EOF
          Host vps
            HostName ${{ secrets.VPS_HOST }}
            Port ${{ secrets.VPS_PORT }}
            User ${{ secrets.VPS_USER }}
            IdentityFile ~/.ssh/vps_key
            StrictHostKeyChecking no
            ConnectTimeout 10
          EOF

      - name: Check current nginx config
        run: |
          ssh vps "grep -c 'moltbook' /etc/nginx/sites-available/mybait.conf 2>/dev/null || echo 0"

      - name: Add Moltbook proxy location
        run: |
          ssh vps bash -s << 'REMOTE_SCRIPT'
          set -euo pipefail
          
          CONF="/etc/nginx/sites-available/mybait.conf"
          if [ ! -f "$CONF" ]; then
            CONF="/etc/nginx/conf.d/mybait.conf"
          fi
          
          # Check if moltbook location already exists
          if grep -q 'moltbook' "$CONF" 2>/dev/null; then
            echo "Moltbook location already exists in $CONF — skipping"
            exit 0
          fi
          
          # Add location block before the closing brace of the server block
          PROXY_BLOCK='
              location /moltbook/ {
                  proxy_pass http://108.167.132.234/moltbook/;
                  proxy_set_header Host mybait.org;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }'
          
          # Insert before last closing brace
          sed -i "s|^\s*}$|${PROXY_BLOCK}\n    }|" "$CONF"
          
          # Test nginx config
          nginx -t
          
          # Reload nginx
          systemctl reload nginx
          
          echo "✅ Moltbook proxy added and nginx reloaded"
          REMOTE_SCRIPT

      - name: Verify Moltbook accessible
        run: |
          sleep 2
          HTTP_CODE=$(curl -sS --max-time 10 -o /dev/null -w "%{http_code}" "https://mybait.org/moltbook/" 2>/dev/null || echo "000")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Moltbook accessible via VPS nginx (HTTP $HTTP_CODE)"
          else
            echo "⚠️ Moltbook returned HTTP $HTTP_CODE — may need manual nginx reload"
          fi
