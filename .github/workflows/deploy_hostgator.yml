name: Deploy to HostGator

on:
  push:
    branches: [main]
    paths:
      - 'netlify/**'
      - 'docs/whitepaper/**'
      - 'baitcoin_api/**'
      - 'baitcoin_core/**'
      - 'baitcoin_token/**'
      - 'baitcoin_bank/**'
      - 'baitcoin_ai/**'
      - 'baitcoin_explorer/**'
      - 'baitcoin_wallet/**'
      - 'baitcoin_memory/**'
      - 'baitcoin_whitelabel/**'
      - 'baitcoin_faucet/**'
      - 'baitcoin_obscura/**'
      - 'baitcoin_bridge/**'
      - 'baitcoin_sdk/**'
      - 'baitcoin_mainnet/**'
      - 'config/**'
      - 'main_daemon.py'
      - 'requirements.txt'
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'What to deploy'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - frontend-only
          - api-only

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: hostgator-deploy
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse credentials
        env:
          HG_CREDS: ${{ secrets.CREDENCIAIS_HOSTGATOR }}
        run: |
          # Use Python to parse JSON safely (avoids bash $ expansion in passwords)
          eval $(python3 -c "
          import os, json
          c = json.loads(os.environ['HG_CREDS'])
          print(f\"HOST={c.get('host','')}\")
          print(f\"USER={c.get('user','')}\")
          print(f\"PASS={c.get('password','')}\")
          print(f\"PORT={c.get('port', 21)}\")
          ")
          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$PASS" ]; then
            echo "::error::Missing host/user/password"; exit 1
          fi
          echo "HOST=$HOST" >> $GITHUB_ENV
          echo "USER=$USER" >> $GITHUB_ENV
          echo "PASS=$PASS" >> $GITHUB_ENV
          echo "PORT=$PORT" >> $GITHUB_ENV
          echo "[+] Parsed: $HOST:${PORT} user=${#USER}c"

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # ═══════════════════════════════════════════════════════════
      # FRONTEND DEPLOY
      # ═══════════════════════════════════════════════════════════
      - name: Prepare frontend files
        if: "${{ github.event.inputs.deploy_target != 'api-only' }}"
        run: |
          mkdir -p deploy-frontend/
          cp netlify/index.html deploy-frontend/index.html
          cp netlify/.htaccess deploy-frontend/.htaccess
          cp docs/whitepaper/bAIcoin_Whitepaper.pdf deploy-frontend/whitepaper.pdf
          echo "--- Frontend files ---"
          ls -la deploy-frontend/

      - name: Deploy frontend to public_html/
        if: "${{ github.event.inputs.deploy_target != 'api-only' }}"
        run: |
          lftp -u "$USER","$PASS" -p "$PORT" "$HOST" <<LFTP_EOF
          set ftp:ssl-force true
          set ssl:verify-certificate no
          set net:timeout 30
          mirror --reverse --overwrite --verbose --no-perms deploy-frontend/ public_html/
          bye
          LFTP_EOF
          echo "=== Frontend deployed ==="

      # ═══════════════════════════════════════════════════════════
      # API DEPLOY — CGI Gateway
      # ═══════════════════════════════════════════════════════════
      - name: Prepare API deploy package
        if: "${{ github.event.inputs.deploy_target != 'frontend-only' }}"
        run: |
          # Create codebase tarball (exclude .git, caches, data, node_modules)
          tar czf /tmp/baitcoin-codebase.tar.gz \
            --exclude='.git' \
            --exclude='__pycache__' \
            --exclude='.pytest_cache' \
            --exclude='*.pyc' \
            --exclude='baitcoin_data' \
            --exclude='.venv' \
            --exclude='node_modules' \
            --exclude='.next' \
            .

          echo "[+] Codebase tarball: $(du -h /tmp/baitcoin-codebase.tar.gz | cut -f1)"

          # Create setup script
          cat > /tmp/setup_bait.sh << 'SETEOF'
          #!/bin/bash
          set -e
          INSTALL="$HOME/baitcoin-api"
          mkdir -p "$INSTALL"
          cd "$INSTALL"
          if [ -f /tmp/baitcoin-codebase.tar.gz ]; then
            tar xzf /tmp/baitcoin-codebase.tar.gz
          fi
          if [ ! -d venv ]; then
            python3 -m venv venv 2>/dev/null || python3.11 -m venv venv
          fi
          source venv/bin/activate
          pip install --quiet --upgrade pip
          pip install --quiet ecdsa numpy aiohttp
          echo "[SETUP] Done. Codebase at $INSTALL"
          SETEOF
          chmod +x /tmp/setup_bait.sh

      - name: Upload codebase and setup to server
        if: "${{ github.event.inputs.deploy_target != 'frontend-only' }}"
        run: |
          lftp -u "$USER","$PASS" -p "$PORT" "$HOST" <<LFTP_EOF
          set ftp:ssl-force true
          set ssl:verify-certificate no
          set net:timeout 60
          mkdir -p public_html
          # Upload codebase tarball
          lcd /tmp
          put baitcoin-codebase.tar.gz -o public_html/codebase.tar.gz
          # Upload setup script
          put setup_bait.sh -o public_html/setup_bait.sh
          chmod 755 public_html/setup_bait.sh
          bye
          LFTP_EOF
          echo "[+] Codebase + setup uploaded"

      - name: Deploy CGI gateway
        if: "${{ github.event.inputs.deploy_target != 'frontend-only' }}"
        run: |
          lftp -u "$USER","$PASS" -p "$PORT" "$HOST" <<LFTP_EOF
          set ftp:ssl-force true
          set ssl:verify-certificate no
          set net:timeout 30
          mkdir -p public_html
          put netlify/api.cgi -o public_html/api.cgi
          chmod 755 public_html/api.cgi
          bye
          LFTP_EOF
          echo "[+] CGI gateway deployed"

      # ═══════════════════════════════════════════════════════════
      # VERIFICATION
      # ═══════════════════════════════════════════════════════════
      - name: Verify deployment
        if: "${{ github.event.inputs.deploy_target != 'api-only' }}"
        run: |
          echo "[+] Verifying frontend..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://www.mybait.org" 2>/dev/null || echo "000")
          echo "  Landing page: HTTP $STATUS"

          STATUS_WP=$(curl -s -o /dev/null -w "%{http_code}" "https://www.mybait.org/whitepaper.pdf" 2>/dev/null || echo "000")
          echo "  Whitepaper:   HTTP $STATUS_WP"

      - name: Trigger API setup (first request)
        if: "${{ github.event.inputs.deploy_target != 'frontend-only' }}"
        run: |
          echo "[+] Triggering API setup via CGI..."
          echo "[+] First request to /api/api/v1/status will auto-start the daemon"
          echo "[+] Note: The daemon needs ~10s to initialize on first hit"
          echo "[+] Visit: https://www.mybait.org/api/api/v1/status"

      - name: Deploy summary
        run: |
          echo ""
          echo "========================================"
          echo "  b'AI'tcoin Deploy Complete"
          echo "========================================"
          echo "  Frontend:  https://www.mybait.org"
          echo "  Whitepaper: https://www.mybait.org/whitepaper.pdf"
          echo "  API:        https://www.mybait.org/api/api/v1/status"
          echo "  Docs:       https://www.mybait.org/api/api/v1/dev/docs"
          echo "  Explorer:   https://www.mybait.org/api/api/v1/explorer/stats"
          echo "========================================"
