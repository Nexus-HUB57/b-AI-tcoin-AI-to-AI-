name: Deploy to HostGator

on:
  push:
    branches: [main]
    paths:
      - 'netlify/**'
      - 'docs/whitepaper/**'
      - 'baitcoin_api/**'
      - 'baitcoin_core/**'
      - 'baitcoin_token/**'
      - 'baitcoin_bank/**'
      - 'baitcoin_ai/**'
      - 'baitcoin_explorer/**'
      - 'baitcoin_wallet/**'
      - 'baitcoin_memory/**'
      - 'baitcoin_whitelabel/**'
      - 'baitcoin_faucet/**'
      - 'baitcoin_obscura/**'
      - 'baitcoin_bridge/**'
      - 'baitcoin_sdk/**'
      - 'baitcoin_mainnet/**'
      - 'config/**'
      - 'main_daemon.py'
      - 'requirements.txt'
      - 'README.md'
      - '.github/workflows/deploy_hostgator.yml'
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'What to deploy'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - frontend-only
          - api-only

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: hostgator-deploy
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare frontend files
        if: "${{ github.event.inputs.deploy_target != 'api-only' }}"
        run: |
          mkdir -p deploy-frontend/
          cp netlify/index.html deploy-frontend/index.html
          cp netlify/.htaccess deploy-frontend/.htaccess
          cp netlify/bainkr.html deploy-frontend/bainkr.html 2>/dev/null || echo "bainkr.html not present"
          cp docs/whitepaper/bAIcoin_Whitepaper.pdf deploy-frontend/whitepaper.pdf 2>/dev/null || echo "whitepaper not present"
          ls -la deploy-frontend/

      - name: Prepare API deploy package
        if: "${{ github.event.inputs.deploy_target != 'frontend-only' }}"
        run: |
          tar czf /tmp/baitcoin-codebase.tar.gz \
            --exclude='.git' --exclude='__pycache__' --exclude='.pytest_cache' \
            --exclude='*.pyc' --exclude='baitcoin_data' --exclude='.venv' \
            --exclude='node_modules' --exclude='.next' .
          echo "Codebase tarball: $(du -h /tmp/baitcoin-codebase.tar.gz | cut -f1)"

          cat > /tmp/setup_bait.sh << 'SETEOF'
          #!/bin/bash
          set -e
          INSTALL="$HOME/baitcoin-api"
          mkdir -p "$INSTALL" && cd "$INSTALL"
          [ -f "$HOME/public_html/codebase.tar.gz" ] && tar xzf "$HOME/public_html/codebase.tar.gz"
          [ ! -d venv ] && (python3 -m venv venv 2>/dev/null || python3.11 -m venv venv || python3.10 -m venv venv)
          source venv/bin/activate
          pip install --quiet --upgrade pip
          pip install --quiet ecdsa numpy aiohttp
          echo "[SETUP] Done. Codebase at $INSTALL"
          SETEOF
          chmod +x /tmp/setup_bait.sh

      - name: Install paramiko
        run: pip install paramiko --quiet

      - name: Deploy to HostGator (SSH key + FTP fallback)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          # Write SSH key to file
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          python3 << 'PYEOF'
          import ftplib, io, os, sys

          ssh_host = os.environ.get('SSH_HOST', '')
          ssh_port = int(os.environ.get('SSH_PORT', '22') or '22')
          ssh_user = os.environ.get('SSH_USER', '')
          ftp_host = os.environ.get('FTP_HOST', '')
          ftp_port = int(os.environ.get('FTP_PORT', '21') or '21')
          ftp_user = os.environ.get('FTP_USER', '').strip()
          ftp_pass = os.environ.get('FTP_PASS', '')

          def try_sftp_key(host, port, user, key_path, timeout=25):
              try:
                  import paramiko
                  key = None
                  for cls in (paramiko.RSAKey, paramiko.Ed25519Key, paramiko.ECDSAKey):
                      try:
                          key = cls.from_private_key_file(key_path)
                          break
                      except Exception:
                          continue
                  if not key:
                      print('SFTP key: could not load private key')
                      return None, None, None
                  ssh = paramiko.SSHClient()
                  ssh.set_missing_host_key_policy(paramiko.AutoAddPolicy())
                  ssh.connect(host, port=port, username=user, pkey=key,
                              timeout=timeout, allow_agent=False, look_for_keys=False)
                  sftp = ssh.open_sftp()
                  print(f'SFTP-key connected to {host}:{port} as {user}')
                  return sftp, ssh, 'sftp'
              except Exception as e:
                  print(f'SFTP-key failed: {e}')
                  return None, None, None

          def try_ftps(host, port, user, pwd, timeout=25):
              try:
                  ftps = ftplib.FTP_TLS()
                  ftps.connect(host, port, timeout=timeout)
                  ftps.login(user, pwd)
                  ftps.prot_p()
                  print(f'FTPS connected to {host}:{port}')
                  return ftps, 'ftps'
              except Exception as e:
                  print(f'FTPS failed: {e}')
                  return None, None

          def try_ftp(host, port, user, pwd, timeout=25):
              try:
                  ftp = ftplib.FTP()
                  ftp.connect(host, port, timeout=timeout)
                  ftp.login(user, pwd)
                  print(f'FTP connected to {host}:{port}')
                  return ftp, 'ftp'
              except Exception as e:
                  print(f'FTP failed: {e}')
                  return None, None

          def ensure_dir_sftp(sftp, path):
              cur = ''
              for part in [p for p in path.split('/') if p]:
                  cur += '/' + part
                  try: sftp.stat(cur)
                  except Exception:
                      try: sftp.mkdir(cur)
                      except Exception: pass

          def ensure_dir_ftp(ftp, path):
              ftp.cwd('/')
              for part in [p for p in path.split('/') if p]:
                  try: ftp.cwd(part)
                  except Exception:
                      try: ftp.mkd(part); ftp.cwd(part)
                      except Exception: pass
              ftp.cwd('/')

          conn = ssh = None
          mode = None

          # 1) SSH key on port 22 (HostGator requires publickey for SSH)
          if ssh_host and ssh_user and os.path.exists(os.path.expanduser('~/.ssh/id_deploy')):
              for port in (ssh_port, 2222):
                  conn, ssh, mode = try_sftp_key(ssh_host, port, ssh_user, os.path.expanduser('~/.ssh/id_deploy'))
                  if conn: break

          # 2) FTPS fallback
          if not conn and ftp_host and ftp_user and ftp_pass:
              conn, mode = try_ftps(ftp_host, ftp_port, ftp_user, ftp_pass)

          # 3) Plain FTP fallback
          if not conn and ftp_host and ftp_user and ftp_pass:
              conn, mode = try_ftp(ftp_host, ftp_port, ftp_user, ftp_pass)

          if not conn:
              print('ERROR: all connection methods failed')
              sys.exit(1)

          print(f'Using {mode} for deployment')

          uploads = []
          if os.path.isdir('deploy-frontend'):
              for name, chm in [('index.html',0o644),('.htaccess',0o644),
                                ('bainkr.html',0o644),('whitepaper.pdf',0o644)]:
                  local = f'deploy-frontend/{name}'
                  if os.path.exists(local):
                      uploads.append((local, f'public_html/{name}', chm))
          if os.path.exists('netlify/api.cgi'):
              uploads.append(('netlify/api.cgi', 'public_html/api.cgi', 0o755))
          if os.path.exists('netlify/watchdog.sh'):
              uploads.append(('netlify/watchdog.sh', 'public_html/watchdog.sh', 0o755))
          if os.path.exists('/tmp/baitcoin-codebase.tar.gz'):
              uploads.append(('/tmp/baitcoin-codebase.tar.gz', 'public_html/codebase.tar.gz', 0o644))
          if os.path.exists('/tmp/setup_bait.sh'):
              uploads.append(('/tmp/setup_bait.sh', 'public_html/setup_bait.sh', 0o755))

          try:
              if mode == 'sftp':
                  # Determine home directory
                  home = conn.normalize('.')
                  print(f'Remote home: {home}')
                  ensure_dir_sftp(conn, home + '/public_html')
                  for local, remote, chm in uploads:
                      dest = home + '/' + remote
                      conn.put(local, dest)
                      try: conn.chmod(dest, chm)
                      except Exception: pass
                      print(f'SFTP {local} -> {dest}')
              else:
                  ensure_dir_ftp(conn, 'public_html')
                  for local, remote, chm in uploads:
                      with open(local, 'rb') as f:
                          conn.storbinary(f'STOR {remote}', f)
                      try: conn.voidcmd(f'SITE CHMOD {oct(chm)[-3:]} {remote}')
                      except Exception: pass
                      print(f'{mode.upper()} {local} -> {remote}')
                  try: conn.quit()
                  except Exception: pass
          finally:
              if ssh:
                  try: ssh.close()
                  except Exception: pass

          print('Deploy upload complete')
          PYEOF

          # Cleanup key
          rm -f ~/.ssh/id_deploy

      - name: Trigger remote setup + daemon bootstrap via SSH
        if: always()
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no -o BatchMode=yes \
              -p "${SSH_PORT:-22}" "${SSH_USER}@${SSH_HOST}" \
              "bash ~/public_html/setup_bait.sh 2>&1 | tail -20; \
               bash ~/public_html/watchdog.sh 2>&1 | tail -10 || true; \
               curl -s -m 10 http://127.0.0.1:18445/api/v1/status | head -c 400 || echo 'daemon not yet responding'" \
              || echo "SSH remote command failed (non-fatal)"
          rm -f ~/.ssh/id_deploy

      - name: Verify deployment
        run: |
          echo "[+] Verifying frontend..."
          for url in "https://www.mybait.org" "https://www.mybait.org/bainkr" \
                     "https://www.mybait.org/api/api/v1/status" \
                     "https://www.mybait.org/whitepaper.pdf"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 15 "$url" 2>/dev/null || echo "000")
            echo "  $url -> HTTP $code"
          done

      - name: Deploy summary
        run: |
          echo ""
          echo "======================================"
          echo "  b'AI'tcoin Deploy Complete"
          echo "======================================"
          echo "  Frontend:  https://www.mybait.org"
          echo "  Bainkr:    https://www.mybait.org/bainkr"
          echo "  API:       https://www.mybait.org/api/api/v1/status"
          echo "======================================"