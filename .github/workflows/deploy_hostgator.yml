name: Deploy to HostGator

on:
  push:
    branches: [main]
    paths:
      - 'netlify/**'
      - 'docs/whitepaper/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: hostgator-deploy
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare deploy files
        run: |
          mkdir -p deploy/
          cp netlify/index.html deploy/index.html
          cp netlify/.htaccess deploy/.htaccess
          cp docs/whitepaper/bAIcoin_Whitepaper.pdf deploy/whitepaper.pdf
          echo '--- Deploy files ---'
          ls -la deploy/

      - name: Parse credentials and deploy to HostGator
        env:
          HG_CREDS: ${{ secrets.CREDENCIAIS_HOSTGATOR }}
        run: |
          # ── Check secret is not empty ──
          if [ -z "$HG_CREDS" ]; then
            echo "::error::CREDENCIAIS_HOSTGATOR secret is EMPTY or not set."
            echo ""
            echo "=== COMO CONFIGURAR ==="
            echo "Va em: GitHub Repo > Settings > Secrets and variables > Actions"
            echo "Edite o secret CREDENCIAIS_HOSTGATOR com o valor:"
            echo ''
            echo '{"host":"SEU_IP_HOSTGATOR","user":"SEU_USUARIO","password":"SUA_SENHA","port":21,"remote_path":"public_html/"}'
            echo ''
            echo 'Ou formato alternativo (pipe-separated):'
            echo 'HOST|USUARIO|SENHA|PORTA|CAMINHO'
            echo 'Ex: 192.168.1.1|meuuser|minhasenha|21|public_html/'
            exit 1
          fi

          # ── Parse credentials (JSON or pipe-separated) ──
          if echo "$HG_CREDS" | python3 -c "import sys,json; json.load(sys.stdin)" 2>/dev/null; then
            echo "[+] Detected JSON format"
            HOST=$(echo "$HG_CREDS" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('host',''))")
            USER=$(echo "$HG_CREDS" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('user',''))")
            PASS=$(echo "$HG_CREDS" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('password',''))")
            PORT=$(echo "$HG_CREDS" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('port', 21))")
            REMOTE_PATH=$(echo "$HG_CREDS" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('remote_path','public_html/'))")
          else
            echo "[+] Detected pipe-separated format"
            IFS='|' read -r HOST USER PASS PORT REMOTE_PATH <<< "$HG_CREDS"
            PORT=${PORT:-21}
            REMOTE_PATH=${REMOTE_PATH:-public_html/}
          fi

          echo "Host: $HOST"
          echo "User: $USER"
          echo "Port: $PORT"
          echo "Remote: $REMOTE_PATH"

          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$PASS" ]; then
            echo "::error::Campos obrigatorios ausentes: host, user, password"
            exit 1
          fi

          # ── Install lftp ──
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp

          # ── Deploy via SFTP/FTP ──
          lftp -u "$USER","$PASS" -p "$PORT" "$HOST" <<LFTP_EOF
          set ftp:ssl-force true
          set ssl:verify-certificate no
          set net:timeout 30
          set net:reconnect-interval-base 5
          mirror --reverse --overwrite --verbose --no-perms deploy/ $REMOTE_PATH
          bye
          LFTP_EOF

          echo ""
          echo "=== Deploy concluido com sucesso em $HOST:$REMOTE_PATH ==="
