version: '3.8'
services:
  prometheus:
    image: prom/prometheus:latest
    container_name: bait-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'

  grafana:
    image: grafana/grafana:latest
    container_name: bait-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}

  alertmanager:
    image: prom/alertmanager:latest
    container_name: bait-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/config.yml

  loki:
    image: grafana/loki:latest
    container_name: bait-loki
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki

  bridge-monitor:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.bridge-monitor
    container_name: bait-bridge-monitor
    ports:
      - "9898:9898"
    environment:
      - RPC_URL=${MAINNET_RPC_URL}
      - BRIDGE_ADDRESS=${BRIDGELOCK_ADDRESS}
    depends_on:
      - prometheus

  dex-monitor:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.dex-monitor
    container_name: bait-dex-monitor
    ports:
      - "9899:9899"
    environment:
      - POOL_ADDRESS=${UNISWAP_V3_POOL_ADDRESS}
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
