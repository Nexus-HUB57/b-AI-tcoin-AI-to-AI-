# mylink-routes-18446 — inserir em TODO server block que tenha 'location /api/' (mybait.org.conf)
# Split: escrita/novos endpoints -> microsservico 18446 (mylink_routes, 18/18 testado); resto -> daemon 18445.
location ~ ^/api(/api)?/v1/(mylink/(post|comment|like)|swap/(offer|execute)|myvideo/orquestrar)$ {
    proxy_pass http://127.0.0.1:18446;
    proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_read_timeout 30s;
}
location ~ ^/api(/api)?/v1/(mylink/feed|swap/book|myvideo/jobs)$ {
    proxy_pass http://127.0.0.1:18446;
    proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_read_timeout 30s;
}
