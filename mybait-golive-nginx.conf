# ============================================================
# mybait-golive-nginx.conf — REFERÊNCIA (consolidar manualmente no VPS)
# Revisão: 2026-08-15  |  B'AI'tcoin — corrige:
#   • /aistore/  -> ERR_TOO_MANY_REDIRECTS (try_files final)
#   • /api.cgi   -> 404 (proxy para Apache do cPanel)
#   • deploy-webhook.php -> PHP não executado (proxy p/ cPanel)
#   • /blockchain e demais clean-URLs -> 404 (try_files $uri.html)
#   • /api/      -> proxy para daemon local 18445
# IMPERATIVO: substituir IP_CPANEL (ex.: 108.167.132.234) e preservar
# os blocos TLS/443 existentes. Validar: nginx -t && systemctl reload nginx
# ============================================================
server {
    listen 80;
    listen [::]:80;
    server_name mybait.org www.mybait.org;

    root /var/www/mybait;
    index index.html;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # API -> daemon read-only (baitcoin-live, 127.0.0.1:18445)
    location /api/ {
        proxy_pass http://127.0.0.1:18445;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        proxy_next_upstream off;
    }

    # AI Store: estático + API própria — FINAL try_files (sem loop)
    location /aistore/ {
        try_files $uri $uri/ /aistore/index.html;
    }
    location = /aistore { return 301 /aistore/; }

    # Webhook de deploy (PHP no Apache do cPanel)
    location = /deploy-webhook.php {
        proxy_pass http://IP_CPANEL;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 2m;
    }

    # Gateway CGI (Apache cPanel) — http://IP_CPANEL/api.cgi/...
    location ^~ /api.cgi {
        proxy_pass http://IP_CPANEL;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
    }
}
