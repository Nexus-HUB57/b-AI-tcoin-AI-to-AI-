[package]
name = "bait_bip340"
version = "0.1.0"
edition = "2021"
description = "BIP-340 Schnorr verify + multi-sig quorum check for BAIT parity oracles"
license = "MIT"

[dependencies]
secp256k1 = { version = "0.29", features = ["global-context", "rand-std"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"

[dev-dependencies]
serde_json = "1"
